<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Poster5ync — a free, open source document editor.">
<title>Poster5ync — Docs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23F2F6FB'/%3E%3Crect x='32' y='41' width='56' height='64' rx='8' fill='%23FFFFFF'/%3E%3Ccircle cx='60' cy='69' r='19' fill='%23EAF1FA'/%3E%3Cpath d='M51.5 61 L60 68 L68.5 61 M60 63.5 L60 74.5 M54 84 L60 74.5 L66 84' fill='none' stroke='%231B2A4A' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='60' cy='57.5' r='5' fill='%231B2A4A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
:root{--paper:#F8F9FA;--surface:#FFFFFF;--ink:#1A1D21;--ink2:#50545C;--line:#E3E5E8;--line2:#F0F1F3;--accent:#2563EB;--accent-d:#1d4ed8;--accent-soft:rgba(37,99,235,.1);--gd-bg:#E8EAED}
body.dark-mode{--paper:#121212;--surface:#1E1E1E;--ink:#E8E8E8;--ink2:#A0A0A0;--line:#333333;--line2:#262626;--accent-soft:rgba(37,99,235,.25);--gd-bg:#1A1A1A}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;padding:0;height:100%}
body{background:var(--gd-bg);color:var(--ink);font-family:'Roboto',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .2s,color .2s}
button,input,select{font-family:inherit;color:inherit}::selection{background:var(--accent-soft)}
.gd-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;height:64px;background:var(--surface);border-bottom:1px solid var(--line)}
.gd-left{display:flex;align-items:center;gap:12px;min-width:200px}.mark{width:32px;height:32px;flex:none}
.brand-name{font:500 18px 'Google Sans',sans-serif;letter-spacing:-0.01em;color:var(--ink)}
.gd-center{flex:1;display:flex;align-items:center;justify-content:center;gap:16px}
.gd-doc-title-wrap{display:flex;flex-direction:column;align-items:center}
.gd-doc-title{font:400 16px 'Roboto',sans-serif;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 8px;outline:none;max-width:400px;text-align:center;transition:background .1s}
.gd-doc-title:hover{background:var(--line2)}.gd-doc-title:focus{background:var(--paper);border-color:var(--line)}
.gd-status{font:400 11px 'Roboto',sans-serif;color:var(--ink2);margin-top:2px}
.gd-right{display:flex;align-items:center;gap:8px;min-width:200px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:500 13px 'Google Sans',sans-serif;padding:7px 14px;border-radius:5px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink);transition:background .15s,color .15s,border-color .15s, opacity .15s}
.btn svg{width:16px;height:16px}.btn:hover{background:var(--line2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.accent:hover{background:var(--accent-d);border-color:var(--accent-d)}
.ibtn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink2);transition:background .15s,color .15s}
.ibtn:hover{background:var(--line2);color:var(--ink)}.ibtn svg{width:18px;height:18px}
.gd-toolbar{position:sticky;top:64px;z-index:45;display:flex;align-items:center;gap:4px;padding:0 16px;height:48px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,0.03);overflow-x:auto}
.gd-tool-group{display:flex;align-items:center;gap:2px}.gd-divider{width:1px;height:24px;background:var(--line);margin:0 8px}
.gd-select{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:4px;border:1px solid transparent;cursor:pointer;font:400 14px 'Roboto',sans-serif;color:var(--ink);background:transparent;outline:none;-webkit-appearance:none;appearance:none}
.gd-select:hover{background:var(--line2)}.gd-select option{background:var(--surface);color:var(--ink)}
.ql-toolbar{border:0 !important; padding:0 !important; background:transparent !important;}.ql-tooltip{display:none !important;}
.ql-snow .ql-stroke{stroke:var(--ink2) !important; stroke-width:1.5 !important;}.ql-snow .ql-fill{fill:var(--ink2) !important;}
.ql-snow .ql-picker-label{color:var(--ink2) !important;}.ql-snow .ql-picker-label:hover{color:var(--ink) !important;}
.ql-snow.ql-toolbar button:hover .ql-stroke, .ql-snow.ql-toolbar button.ql-active .ql-stroke{stroke:var(--accent) !important;}
.ql-snow.ql-toolbar button:hover .ql-fill, .ql-snow.ql-toolbar button.ql-active .ql-fill{fill:var(--accent) !important;}
.ql-snow.ql-toolbar button:hover, .ql-snow.ql-toolbar button.ql-active{background:var(--line2); border-radius:50%;}
.ql-snow .ql-picker-label:hover{background:var(--line2); border-radius:4px;}
.ql-snow.ql-toolbar .ql-picker-label.ql-active{color:var(--accent) !important;}
.ql-snow.ql-toolbar .ql-picker-label.ql-active .ql-stroke{stroke:var(--accent) !important;}
.gd-stage{padding:40px 16px 96px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:calc(100vh - 112px)}
body.dark-mode .gd-stage{background-image:none}
.sheet{width:8.5in;max-width:100%;min-height:11in;background:#fff;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -10px rgba(0,0,0,0.15);padding:1in 1in 0.5in;display:flex;flex-direction:column;}
.ql-container{border:0 !important; font-family:'Roboto', Arial, sans-serif !important; font-size:11pt !important; line-height:1.5 !important; color:#1A1D21 !important;}
.ql-editor{padding:0 !important; min-height:9in;}
.ql-editor h1{font-size:20pt; font-weight:400; line-height:1.3; margin-top:0; margin-bottom:12px;}
.ql-editor h2{font-size:16pt; font-weight:400; line-height:1.3; margin-top:16px; margin-bottom:8px;}
.ql-editor p{margin-bottom:8px;}.ql-editor ul, .ql-editor ol{padding-left:1.5em; margin-bottom:8px;}
.ql-editor a{color:var(--accent);}.ql-editor.ql-blank::before{color:#D1D5DB; font-style:normal; left:0;}
body.dark-mode .sheet{background:#1E1E1E;}body.dark-mode .ql-container{color:#E8E8E8 !important;}
body.dark-mode .ql-editor.ql-blank::before{color:#444;}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:8px;font:400 14px 'Roboto',sans-serif;box-shadow:0 10px 25px -5px rgba(0,0,0,0.3);animation:tin .22s both;}
.toast svg{width:16px;height:16px;color:#90CAF9;flex:none}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@media print{@page{size:Letter;margin:0} body{background:#fff}.gd-header,.gd-toolbar,#toasts{display:none!important}.gd-stage{display:block;padding:0;background:none;min-height:0}.sheet{width:8.5in;min-height:11in;margin:0;border-radius:0;box-shadow:none;padding:0.5in 0.75in}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width: 700px){.gd-left span{display:none}.gd-toolbar{overflow-x:auto;justify-content:flex-start}.sheet{width:100%;padding:30px 20px;min-height:auto}}
</style>
</head>
<body>

<header class="gd-header">
  <div class="gd-left">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" focusable="false">
      <rect width="120" height="120" rx="26" fill="#F2F6FB"/><rect x="32" y="41" width="56" height="64" rx="8" fill="#FFFFFF"/>
      <circle cx="60" cy="69" r="19" fill="#EAF1FA"/><path d="M51.5 61 L60 68 L68.5 61 M60 63.5 L60 74.5 M54 84 L60 74.5 L66 84" fill="none" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="57.5" r="5" fill="#1B2A4A"/>
    </svg>
    <span class="brand-name">Poster5ync</span>
  </div>
  <div class="gd-center">
    <div class="gd-doc-title-wrap">
      <input type="text" id="headerDocTitle" class="gd-doc-title" placeholder="Untitled document">
      <span class="gd-status" id="gdStatus">Saved locally</span>
    </div>
  </div>
  <div class="gd-right">
    <button class="ibtn" id="darkToggleBtn" title="Toggle Dark Mode"><i data-lucide="moon"></i></button>
    <button class="btn accent" id="shareBtn"><i data-lucide="link"></i> Share</button>
  </div>
</header>

<div id="toolbar" class="gd-toolbar">
  <div class="gd-tool-group">
    <select class="gd-select ql-size"><option value="small">Small</option><option value="normal" selected>Normal</option><option value="large">Large</option><option value="huge">Huge</option></select>
    <span class="gd-divider"></span>
    <select class="gd-select ql-font"><option value="sans-serif" selected>Roboto</option><option value="serif">Serif</option><option value="monospace">Mono</option></select>
  </div>
  <span class="gd-divider"></span>
  <div class="gd-tool-group">
    <button class="ibtn ql-bold" title="Bold (Ctrl+B)"><i data-lucide="bold"></i></button>
    <button class="ibtn ql-italic" title="Italic (Ctrl+I)"><i data-lucide="italic"></i></button>
    <button class="ibtn ql-underline" title="Underline (Ctrl+U)"><i data-lucide="underline"></i></button>
    <button class="ibtn ql-strike" title="Strikethrough"><i data-lucide="strikethrough"></i></button>
  </div>
  <span class="gd-divider"></span>
  <div class="gd-tool-group">
    <button class="ibtn ql-list" value="bullet" title="Bulleted list"><i data-lucide="list"></i></button>
    <button class="ibtn ql-list" value="ordered" title="Numbered list"><i data-lucide="list-ordered"></i></button>
  </div>
  <span class="gd-divider"></span>
  <div class="gd-tool-group">
    <button class="ibtn ql-align" value="" title="Left align"><i data-lucide="align-left"></i></button>
    <button class="ibtn ql-align" value="center" title="Center align"><i data-lucide="align-center"></i></button>
    <button class="ibtn ql-align" value="right" title="Right align"><i data-lucide="align-right"></i></button>
  </div>
  <span class="gd-divider"></span>
  <div class="gd-tool-group">
    <button class="ibtn ql-header" value="1" title="Title"><i data-lucide="heading-1"></i></button>
    <button class="ibtn ql-header" value="2" title="Subtitle"><i data-lucide="heading-2"></i></button>
    <button class="ibtn ql-blockquote" title="Quote"><i data-lucide="quote"></i></button>
    <button class="ibtn ql-code-block" title="Code block"><i data-lucide="code-2"></i></button>
  </div>
  <span class="gd-divider"></span>
  <div class="gd-tool-group">
    <button class="ibtn ql-link" title="Insert link"><i data-lucide="link"></i></button>
    <button class="ibtn" id="printBtn" title="Print / PDF"><i data-lucide="printer"></i></button>
    <button class="ibtn" id="exportBtn" title="Download as HTML"><i data-lucide="download"></i></button>
  </div>
</div>

<main class="gd-stage" id="main-content">
  <div class="sheet"><div id="editor"></div></div>
</main>

<div id="toasts" aria-live="polite"></div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
function refreshIcons(){try{if(window.lucide&&lucide.createIcons)lucide.createIcons();}catch(e){}}

const quill = new Quill('#editor', {
  modules: { toolbar: '#toolbar' },
  theme: 'snow',
  placeholder: 'Start typing your document...',
  formats: ['header', 'font', 'size', 'bold', 'italic', 'underline', 'strike', 'list', 'bullet', 'align', 'blockquote', 'code-block', 'link']
});

let headerDocTitle = $('#headerDocTitle');
let docTitle = 'Untitled document';
let saveT = null;

function save() {
    clearTimeout(saveT);
    $('#gdStatus').textContent = 'Saving...';
    saveT = setTimeout(() => {
        try{localStorage.setItem('poster5ync.doc', JSON.stringify({title: docTitle, content: quill.getContents()}))}catch(e){}
        $('#gdStatus').textContent = 'Saved locally';
    }, 400);
}

headerDocTitle.addEventListener('input', () => {
    docTitle = headerDocTitle.value;
    document.title = docTitle + ' - Poster5ync';
    save();
});

quill.on('text-change', () => { save(); });

// Load from local storage on startup
try {
    const raw = localStorage.getItem('poster5ync.doc');
    if (raw) {
        const localDoc = JSON.parse(raw);
        docTitle = localDoc.title || 'Untitled document';
        headerDocTitle.value = docTitle;
        document.title = docTitle + ' - Poster5ync';
        if(localDoc.content) quill.setContents(localDoc.content);
    }
} catch(e) {}

// Buttons
 $('#shareBtn').onclick = async () => {
    try {
        await navigator.clipboard.writeText(window.location.href);
        toast('Link copied! (Note: Live collaboration requires Node hosting)', 'info');
    } catch(e) { toast('Copy failed.', 'alert'); }
};
 $('#printBtn').onclick = () => window.print();
 $('#exportBtn').onclick = () => {
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${docTitle}</title><style>body{font-family:Arial; line-height:1.5; padding:1in; max-width:8.5in; margin:auto;}</style></head><body>${quill.root.innerHTML}</body></html>`;
    const blob = new Blob([html], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (docTitle || 'document').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-') + '.html';
    document.body.append(a); a.click(); a.remove();
};

// Dark Mode
const darkToggleBtn = $('#darkToggleBtn');
function applyDarkMode(isDark) {
    document.body.classList.toggle('dark-mode', isDark);
    localStorage.setItem('poster5ync.dark', isDark ? '1' : '0');
    darkToggleBtn.innerHTML = isDark ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
    refreshIcons();
}
darkToggleBtn.onclick = () => applyDarkMode(!document.body.classList.contains('dark-mode'));

// Toasts
function toast(msg, kind) {
    const t = document.createElement('div');
    t.className = 'toast';
    const icon = kind === 'check' ? 'check-circle' : (kind === 'alert' ? 'alert-circle' : 'info');
    t.innerHTML = `<i data-lucide="${icon}"></i><span>${msg}</span>`;
    $('#toasts').append(t); refreshIcons();
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(10px)'; setTimeout(() => t.remove(), 300); }, 3000);
}

// Boot
const isDark = localStorage.getItem('poster5ync.dark') === '1';
applyDarkMode(isDark);
refreshIcons();
})();
</script>
</body>
</html>
