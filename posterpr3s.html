<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="3.0">
<title>PosterPr3s — Presentation Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Lexend:wght@400;500;600&family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root { --paper:#F8F9FA; --surface:#FFFFFF; --ink:#1A1D21; --ink2:#50545C; --line:#E3E5E8; --accent:#F59E0B; --shadow: 0 10px 30px rgba(0,0,0,0.08); --title-font: 'Bricolage Grotesque'; }
body.dark-mode { --paper:#121212; --surface:#1E1E1E; --ink:#E8E8E8; --ink2:#A0A0A0; --line:#333333; --shadow: 0 10px 30px rgba(0,0,0,0.5); }
/* Calm Mode: Soft, low-contrast sepia/gray theme for reduced eye strain */
body.calm-mode { --paper:#F3EDE2; --surface:#F9F5EC; --ink:#4F4A41; --ink2:#7A736A; --line:#E0D9CC; --accent:#A89376; --shadow: 0 10px 30px rgba(0,0,0,0.05); }
* { box-sizing:border-box; margin:0; padding:0; font-family:'Lexend',sans-serif; }
body { background:var(--paper); color:var(--ink); height:100vh; display:flex; flex-direction:column; transition:background .2s; overflow: hidden; }

/* Header */
header { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:var(--surface); border-bottom:1px solid var(--line); z-index: 10; gap: 10px; flex-wrap: wrap;}
.logo { font-family:var(--title-font); font-weight:800; color:var(--accent); text-decoration:none; font-size: 1.2rem; }
.toolbar { display:flex; gap:6px; align-items: center; flex-wrap: wrap; }
.btn { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:600; cursor:pointer; font-family:var(--title-font); transition: 0.2s; display: flex; align-items: center; gap: 6px; font-size: 14px;}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
.btn-secondary { background:transparent; border:1px solid var(--line); color:var(--ink); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }
.btn-secondary.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Layout */
.main { flex:1; display:flex; overflow: hidden; transition: all 0.3s ease; }
.sidebar { width:220px; background:var(--surface); border-right:1px solid var(--line); padding:12px; overflow-y:auto; display: flex; flex-direction: column; gap: 8px; transition: width 0.3s ease, padding 0.3s ease; }
.main.zen-mode .sidebar { width: 0; padding: 0; border: none; overflow: hidden; }
.canvas-area { flex:1; padding:30px; display:flex; flex-direction: column; align-items:center; justify-content:center; position: relative; transition: padding 0.3s ease; }
.main.zen-mode .canvas-area { padding: 80px; }

/* Editor Toolbar */
.editor-toolbar { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: flex; gap: 4px; margin-bottom: 20px; box-shadow: var(--shadow); transition: opacity 0.2s, transform 0.2s; flex-wrap: wrap; }
.main.zen-mode .editor-toolbar { opacity: 0; transform: translateY(-20px); pointer-events: none; }
.editor-btn { background: transparent; border: none; width: 34px; height: 34px; border-radius: 6px; cursor: pointer; color: var(--ink2); font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.editor-btn:hover { background: var(--paper); color: var(--accent); }
.editor-btn.wide { width: auto; padding: 0 10px; font-size: 12px; }
.color-input { width: 34px; height: 34px; border: none; background: transparent; cursor: pointer; border-radius: 6px; padding: 0; }
.toolbar-divider { width: 1px; background: var(--line); margin: 0 4px; }

/* Slides */
.slide-thumb { background:var(--paper); border:2px solid transparent; border-radius:8px; height:80px; margin-bottom:8px; display:flex; align-items:center; justify-content:center; cursor:grab; font-weight:600; color:var(--ink2); position: relative; transition: 0.2s; padding: 10px; text-align: center; overflow: hidden; }
.slide-thumb:hover { border-color: var(--line); }
.slide-thumb.active { border-color:var(--accent); color: var(--accent); }
.slide-thumb.dragging { opacity: 0.4; transform: scale(0.95); }
.slide-thumb.drag-over { border-top: 3px solid var(--accent); }
.thumb-controls { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; opacity: 0; transition: 0.2s; }
.slide-thumb:hover .thumb-controls { opacity: 1; }
.thumb-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; width: 20px; height: 20px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); }

/* Canvas */
.slide-canvas { width:800px; height:450px; background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:50px; display:flex; flex-direction:column; justify-content:center; transition: background 0.5s ease; position: relative; overflow: hidden; }
.slide-title { font-family:var(--title-font); font-size:42px; margin-bottom:20px; color:var(--accent); outline:none; line-height: 1.1; }
.slide-body { font-size:22px; line-height:1.6; color:var(--ink); outline:none; flex: 1; overflow-y: auto; }
.slide-body ul, .slide-body ol { padding-left: 20px; }
.slide-body pre { background: rgba(0,0,0,0.05); padding: 15px; border-radius: 8px; font-family: 'Space Mono', monospace; font-size: 16px; overflow-x: auto; }
.slide-body img { max-width: 100%; max-height: 250px; border-radius: 8px; margin: 10px 0; display: block; }
body.dark-mode .slide-body pre { background: rgba(255,255,255,0.05); }

/* Magic Layout & Charts */
.magic-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
.magic-quote { font-family: 'Playfair Display', serif; font-size: 32px; font-style: italic; text-align: center; color: var(--ink); }
.chart-container { display: flex; gap: 15px; align-items: flex-end; height: 200px; padding: 20px 0; border-bottom: 2px solid var(--ink2); margin-top: 20px; }
.chart-bar { flex: 1; background: var(--accent); border-radius: 6px 6px 0 0; transition: height 0.5s ease; display: flex; justify-content: center; align-items: flex-start; color: #fff; font-weight: bold; padding-top: 5px; font-size: 14px; position: relative; }
.chart-bar span { position: absolute; bottom: -25px; color: var(--ink2); font-size: 12px; }

/* Dynamic Gradients */
.bg-sunset { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
.bg-ocean { background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%); }
.bg-forest { background: linear-gradient(120deg, #d4fc79 0%, #96e6a1 100%); }
.bg-midnight { background: linear-gradient(120deg, #2c3e50 0%, #4ca1af 100%); color: white; }
.bg-midnight .slide-title, .bg-midnight .slide-body { color: #fff; }

/* Speaker Notes */
.notes-panel { width: 800px; height: 0; background: var(--surface); border-radius: 12px; margin-top: 20px; overflow: hidden; transition: height 0.3s ease; box-shadow: var(--shadow); border: 1px solid var(--line); display: flex; flex-direction: column; }
.notes-panel.active { height: 150px; }
.notes-header { padding: 10px 16px; border-bottom: 1px solid var(--line); font-weight: 600; color: var(--ink2); display: flex; justify-content: space-between; align-items: center; font-family: var(--title-font); }
.notes-area { flex: 1; padding: 16px; outline: none; color: var(--ink2); font-size: 14px; resize: none; border: none; background: transparent; }

/* Modals & Overlays */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: flex-start; justify-content: center; padding-top: 15vh; }
.modal { width: 500px; background: var(--surface); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); overflow: hidden; border: 1px solid var(--line); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--line); font-family: var(--title-font); font-weight: 700; display: flex; justify-content: space-between; }
.modal-body { padding: 20px; }
.modal-input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); outline: none; font-size: 14px; margin-bottom: 10px; }
.modal-btn { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }

/* Command Palette */
.cmdk-results { max-height: 300px; overflow-y: auto; padding: 8px; }
.cmdk-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--ink); }
.cmdk-item:hover { background: var(--paper); }
.cmdk-item span { font-size: 12px; color: var(--ink2); margin-left: auto; background: var(--paper); padding: 2px 6px; border-radius: 4px; }

/* Present Mode */
.present-mode { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
.present-progress { position: fixed; top: 0; left: 0; height: 4px; background: var(--accent); z-index: 1001; transition: width 0.3s ease; }
.present-timer { position: fixed; top: 20px; right: 20px; color: rgba(255,255,255,0.5); font-family: 'Space Mono', monospace; font-size: 14px; z-index: 1001; }
.present-slide { width: 80vw; height: 45vw; padding: 5vw; display: flex; flex-direction: column; justify-content: center; position: absolute; }
.present-title { font-family:var(--title-font); font-size: 4vw; margin-bottom: 2vw; color: var(--accent); }
.present-body { font-size: 2vw; line-height: 1.5; color: #fff; white-space: pre-wrap; }
.present-controls { position: fixed; bottom: 30px; display: flex; gap: 10px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 50px; backdrop-filter: blur(10px); z-index: 10; }
.present-controls button { background: rgba(255,255,255,0.2); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 16px; }
.present-controls button.active { background: var(--accent); }
.laser-pointer { position: fixed; width: 20px; height: 20px; border-radius: 50%; background: rgba(255, 0, 0, 0.8); pointer-events: none; z-index: 2000; display: none; box-shadow: 0 0 15px 5px rgba(255, 0, 0, 0.4); transform: translate(-50%, -50%); }
.confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1999; }
.draw-canvas { position: fixed; inset: 0; z-index: 1998; cursor: crosshair; display: none; }

/* Grid View */
.grid-view { position: fixed; inset: 0; background: var(--paper); z-index: 1500; display: none; padding: 40px; overflow-y: auto; }
.grid-view.active { display: block; }
.grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
.grid-slide { aspect-ratio: 16/9; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; justify-content: center; padding: 20px; overflow: hidden; position: relative; transition: transform 0.2s; border: 2px solid transparent; }
.grid-slide:hover { transform: scale(1.02); border-color: var(--accent); }

/* Transitions */
@keyframes fadeAnim { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideLeftAnim { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes zoomAnim { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes flipAnim { from { transform: perspective(1000px) rotateY(90deg); opacity: 0; } to { transform: perspective(1000px) rotateY(0deg); opacity: 1; } }

/* Toast */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: var(--surface); padding: 12px 24px; border-radius: 8px; box-shadow: var(--shadow); transition: transform 0.3s; z-index: 3000; font-weight: 600; }
.toast.show { transform: translateX(-50%) translateY(0); }
[contenteditable=true]:empty:before { content: attr(data-ph); color: #aaa; font-style: italic; }

@media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; display: flex !important; }
    .print-slide { width: 100vw; height: 100vh; page-break-after: always; display: flex; flex-direction: column; justify-content: center; padding: 10vw; box-shadow: none; border-radius: 0; }
}
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo">← PosterPr3s</a>
    <div class="toolbar">
        <button class="btn btn-secondary" onclick="toggleZenMode()">🧘 Zen</button>
        <button class="btn btn-secondary" onclick="toggleNotes()">📝 Notes</button>
        <button class="btn btn-secondary" onclick="toggleGridView()">🔡 Grid</button>
        <button class="btn btn-secondary" onclick="openBrandKit()">🎨 Brand Kit</button>
        <button class="btn btn-secondary" onclick="openSnapshots()">⏱ Snapshots</button>
        <button class="btn btn-secondary" onclick="openCmdk()">⌘ Cmd</button>
        <button class="btn btn-secondary" onclick="toggleTheme()">🌓</button>
        <button class="btn btn-secondary" onclick="exportPDF()">⬇ PDF</button>
        <button class="btn btn-secondary" onclick="exportHTML()">📦 HTML</button>
        <button class="btn btn-secondary" onclick="exportPPTX()" style="border-color: var(--accent); color: var(--accent);">⬇ PPTX</button>
        <button class="btn btn-secondary" onclick="generateShareLink()">🔗 Share</button>
        <button class="btn btn-secondary" onclick="addSlide()">+ Slide</button>
        <button class="btn" onclick="startPresentation()">▶ Present</button>
    </div>
</header>

<div class="main" id="mainContainer">
    <div class="sidebar" id="sidebar"></div>
    <div class="canvas-area">
        <div class="editor-toolbar">
            <button class="editor-btn" onclick="execCmd('bold')"><b>B</b></button>
            <button class="editor-btn" onclick="execCmd('italic')"><i>I</i></button>
            <button class="editor-btn" onclick="execCmd('underline')"><u>U</u></button>
            <button class="editor-btn" onclick="execCmd('insertUnorderedList')">• List</button>
            <button class="editor-btn" onclick="execCmd('formatBlock', 'pre')" title="Code Block">&lt;/&gt;</button>
            <input type="color" class="color-input" onchange="execCmd('foreColor', this.value)" title="Text Color">
            <div class="toolbar-divider"></div>
            <button class="editor-btn" onclick="execCmd('justifyLeft')">⬅</button>
            <button class="editor-btn" onclick="execCmd('justifyCenter')">⬌</button>
            <button class="editor-btn" onclick="execCmd('justifyRight')">➡</button>
            <div class="toolbar-divider"></div>
            <button class="editor-btn wide" onclick="generateChart()" title="Type 'chart 10, 20, 30' then click">📊 Chart</button>
            <button class="editor-btn wide" onclick="magicLayout()" title="Auto-format text">✨ Magic Layout</button>
            <button class="editor-btn wide" onclick="summarizeText()" title="Turn selected text into bullets">📝 Summarize</button>
            <button class="editor-btn wide" onclick="generateAgenda()" title="Generate Agenda">📋 Agenda</button>
            <div class="toolbar-divider"></div>
            <button class="editor-btn" onclick="changeBg('default')" title="Default">⬜</button>
            <button class="editor-btn" onclick="changeBg('bg-sunset')" title="Sunset">🌅</button>
            <button class="editor-btn" onclick="changeBg('bg-ocean')" title="Ocean">🌊</button>
            <button class="editor-btn" onclick="changeBg('bg-forest')" title="Forest">🌲</button>
            <button class="editor-btn" onclick="changeBg('bg-midnight')" title="Midnight">🌙</button>
        </div>
        <div class="slide-canvas" id="canvas">
            <div class="slide-title" id="titleArea" contenteditable="true" data-ph="Slide Title"></div>
            <div class="slide-body" id="bodyArea" contenteditable="true" data-ph="Start typing, paste images, or drag & drop..."></div>
        </div>
        <div class="notes-panel" id="notesPanel">
            <div class="notes-header">
                <span>Speaker Notes</span>
                <button onclick="toggleNotes()" style="background:none; border:none; cursor:pointer; color:var(--ink2);">✖</button>
            </div>
            <textarea class="notes-area" id="notesArea" placeholder="Write your speaker notes here..."></textarea>
        </div>
    </div>
</div>

<!-- Command Palette -->
<div class="overlay" id="cmdkOverlay" onclick="if(event.target === this) closeCmdk()">
    <div class="modal" style="width: 500px;">
        <input type="text" class="modal-input" style="border: none; border-bottom: 1px solid var(--line); border-radius: 0; margin: 0; padding: 20px;" id="cmdkInput" placeholder="Type a command or search..." oninput="filterCmdk()" autofocus>
        <div class="cmdk-results" id="cmdkResults"></div>
    </div>
</div>

<!-- Brand Kit Modal -->
<div class="overlay" id="brandKitOverlay" onclick="if(event.target === this) closeBrandKit()">
    <div class="modal">
        <div class="modal-header">🎨 Global Brand Kit <button onclick="closeBrandKit()" style="background:none; border:none; cursor:pointer;">✖</button></div>
        <div class="modal-body">
            <p style="margin-bottom: 12px; color: var(--ink2); font-size: 14px;">Changes apply instantly across all slides.</p>
            <label style="font-size: 12px; font-weight: 600;">Accent Color</label>
            <input type="color" id="brandColor" class="modal-input" style="height: 40px; padding: 5px;" value="#F59E0B">
            <label style="font-size: 12px; font-weight: 600; display: block; margin-top: 10px;">Title Font</label>
            <select id="brandFont" class="modal-input">
                <option value="'Bricolage Grotesque', sans-serif">Bricolage Grotesque (Modern)</option>
                <option value="'Playfair Display', serif">Playfair Display (Elegant)</option>
                <option value="'Space Mono', monospace">Space Mono (Tech)</option>
                <option value="'Lexend', sans-serif">Lexend (Clean)</option>
            </select>
            <button class="modal-btn" onclick="applyBrandKit()">Apply to All Slides</button>
        </div>
    </div>
</div>

<!-- Snapshots Modal -->
<div class="overlay" id="snapshotsOverlay" onclick="if(event.target === this) closeSnapshots()">
    <div class="modal">
        <div class="modal-header">⏱ Version Snapshots <button onclick="closeSnapshots()" style="background:none; border:none; cursor:pointer;">✖</button></div>
        <div class="modal-body">
            <button class="modal-btn" onclick="takeSnapshot()" style="margin-bottom: 20px;">+ Save Current State</button>
            <div id="snapshotList"></div>
        </div>
    </div>
</div>

<!-- Presentation Mode Overlay -->
<div class="present-mode" id="presentMode">
    <div class="present-progress" id="presentProgress" style="width: 0%;"></div>
    <div class="present-timer" id="presentTimer">00:00</div>
    <div class="present-slide" id="presentSlide">
        <div class="present-title" id="presentTitle"></div>
        <div class="present-body" id="presentBody"></div>
    </div>
    <canvas class="draw-canvas" id="drawCanvas"></canvas>
    <div class="present-controls">
        <button onclick="prevPresentSlide()">◀</button>
        <button onclick="toggleVoice()" id="voiceBtn" title="Voice Control (V)">🎤</button>
        <button onclick="triggerConfetti()" title="Confetti (C)">🎉</button>
        <button onclick="toggleLaser()" id="laserBtn" title="Laser Pointer (L)">🔴</button>
        <button onclick="toggleDraw('pen')" id="penBtn" title="Draw (D)">🖌️</button>
        <button onclick="toggleDraw('highlighter')" id="highlightBtn" title="Highlight (H)">🖍️</button>
        <button onclick="clearDrawing()" title="Clear Drawing">🧹</button>
        <button onclick="toggleAutoPlay()" id="autoPlayBtn" title="Auto-Play (A)">⏳</button>
        <button onclick="exitPresentation()">✖</button>
        <button onclick="nextPresentSlide()">▶</button>
    </div>
</div>
<div class="laser-pointer" id="laserPointer"></div>
<canvas class="confetti-canvas" id="confettiCanvas"></canvas>

<!-- Grid View Overlay -->
<div class="grid-view" id="gridView">
    <div class="grid-container" id="gridContainer"></div>
</div>

<div id="print-area" style="display: none;"></div>
<div class="toast" id="toast"></div>

<script>
let state = { slides: [], currentSlide: 0, globalStyles: { accent: '#F59E0B', font: "'Bricolage Grotesque', sans-serif" } };
const sidebar = document.getElementById('sidebar');
const titleArea = document.getElementById('titleArea');
const bodyArea = document.getElementById('bodyArea');
const notesArea = document.getElementById('notesArea');
const canvas = document.getElementById('canvas');
const mainContainer = document.getElementById('mainContainer');
const presentMode = document.getElementById('presentMode');
const laserPointer = document.getElementById('laserPointer');
const drawCanvas = document.getElementById('drawCanvas');
const drawCtx = drawCanvas.getContext('2d');

let audioCtx;
function playClick() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = Math.random() * 100 + 600; o.type = 'square';
    g.gain.setValueAtTime(0.02, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    o.start(); o.stop(audioCtx.currentTime + 0.05);
}

function init() {
    const params = new URLSearchParams(window.location.search);
    const sharedData = params.get('data');
    if (sharedData) {
        try {
            state = JSON.parse(decodeURIComponent(atob(sharedData)));
            showToast('Loaded shared presentation!');
            history.replaceState({}, document.title, window.location.pathname);
        } catch(e) { showToast('Invalid share link'); }
    } else {
        const saved = localStorage.getItem('posterprs_data');
        if (saved) {
            state = JSON.parse(saved);
            state.slides.forEach(s => { if(!s.transition) s.transition = 'fadeAnim'; if(!s.notes) s.notes = ''; });
            if(!state.globalStyles) state.globalStyles = { accent: '#F59E0B', font: "'Bricolage Grotesque', sans-serif" };
            if(state.slides.length === 0) state.slides = [{ id: Date.now(), title: '', body: '', bg: 'default', transition: 'fadeAnim', notes: '' }];
        } else {
            state.slides = [{ id: Date.now(), title: '', body: '', bg: 'default', transition: 'fadeAnim', notes: '' }];
        }
    }
    applyBrandKitStyles(); renderSidebar(); loadSlide(0);
}

let saveTimeout;
function autoSave() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        try { localStorage.setItem('posterprs_data', JSON.stringify(state)); showToast('✓ Auto-saved'); } 
        catch (e) { showToast('⚠ Storage full! Export to HTML.'); }
    }, 1000);
}

function syncContent() {
    if (!state.slides[state.currentSlide]) return;
    state.slides[state.currentSlide].title = titleArea.innerHTML;
    state.slides[state.currentSlide].body = bodyArea.innerHTML;
    state.slides[state.currentSlide].notes = notesArea.value;
    autoSave(); updateThumb(state.currentSlide);
}

function addSlide() { state.slides.push({ id: Date.now(), title: '', body: '', bg: 'default', transition: 'fadeAnim', notes: '' }); renderSidebar(); loadSlide(state.slides.length - 1); closeCmdk(); }
function deleteSlide(index) { if (state.slides.length <= 1) return showToast("Can't delete the only slide!"); state.slides.splice(index, 1); if (state.currentSlide >= state.slides.length) state.currentSlide = state.slides.length - 1; renderSidebar(); loadSlide(state.currentSlide); closeCmdk(); }
function duplicateSlide(index) { const o = state.slides[index]; const c = { ...o, id: Date.now(), title: o.title, body: o.body, notes: o.notes }; state.slides.splice(index + 1, 0, c); renderSidebar(); loadSlide(index + 1); closeCmdk(); }

function renderSidebar() {
    sidebar.innerHTML = '';
    state.slides.forEach((slide, index) => {
        const thumb = document.createElement('div');
        thumb.className = 'slide-thumb' + (index === state.currentSlide ? ' active' : '');
        thumb.style.background = getGradientCSS(slide.bg);
        thumb.draggable = true;
        thumb.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', index); thumb.classList.add('dragging'); });
        thumb.addEventListener('dragend', () => thumb.classList.remove('dragging'));
        thumb.addEventListener('dragover', (e) => { e.preventDefault(); thumb.classList.add('drag-over'); });
        thumb.addEventListener('dragleave', () => thumb.classList.remove('drag-over'));
        thumb.addEventListener('drop', (e) => {
            e.preventDefault(); thumb.classList.remove('drag-over');
            const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
            if (fromIndex === index) return;
            const moved = state.slides.splice(fromIndex, 1)[0];
            state.slides.splice(index, 0, moved);
            state.currentSlide = index; renderSidebar(); autoSave();
        });
        thumb.innerHTML = `<span style="font-size: 12px; z-index: 2;">${slide.title.replace(/<[^>]*>?/gm, '').substring(0, 20) || 'Slide ' + (index + 1)}</span><div class="thumb-controls"><button class="thumb-btn" onclick="event.stopPropagation(); duplicateSlide(${index})" title="Duplicate">⧉</button><button class="thumb-btn" onclick="event.stopPropagation(); deleteSlide(${index})" title="Delete">🗑</button></div>`;
        thumb.onclick = () => loadSlide(index);
        sidebar.appendChild(thumb);
    });
}

function updateThumb(index) { const thumb = sidebar.children[index]; if(thumb) thumb.querySelector('span').textContent = state.slides[index].title.replace(/<[^>]*>?/gm, '').substring(0, 20) || 'Slide ' + (index + 1); }
function getGradientCSS(bg) {
    switch(bg) {
        case 'bg-sunset': return 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%)';
        case 'bg-ocean': return 'linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%)';
        case 'bg-forest': return 'linear-gradient(120deg, #d4fc79 0%, #96e6a1 100%)';
        case 'bg-midnight': return 'linear-gradient(120deg, #2c3e50 0%, #4ca1af 100%)';
        default: return 'var(--paper)';
    }
}

function loadSlide(index) {
    state.currentSlide = index;
    const slide = state.slides[index];
    canvas.className = 'slide-canvas';
    if (slide.bg !== 'default') canvas.classList.add(slide.bg);
    titleArea.innerHTML = slide.title; bodyArea.innerHTML = slide.body; notesArea.value = slide.notes || '';
    renderSidebar();
}

function execCmd(command, value = null) { document.execCommand(command, false, value); syncContent(); }
function changeBg(bg) { state.slides[state.currentSlide].bg = bg; canvas.className = 'slide-canvas'; if (bg !== 'default') canvas.classList.add(bg); autoSave(); renderSidebar(); }
function toggleZenMode() { mainContainer.classList.toggle('zen-mode'); }
function toggleNotes() { document.getElementById('notesPanel').classList.toggle('active'); }

// --- CHARTS & MAGIC LAYOUT ---
function generateChart() {
    const sel = window.getSelection();
    if (!sel.rangeCount || !sel.toString().trim().startsWith('chart ')) return showToast('Highlight text starting with "chart " (e.g., chart 10, 20, 30)');
    
    const text = sel.toString().replace('chart ', '');
    const data = text.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
    if(data.length === 0) return showToast('No valid numbers found.');
    
    const maxVal = Math.max(...data);
    const bars = data.map((val, i) => `<div class="chart-bar" style="height: 0%;" data-height="${(val/maxVal)*100}"><span>${val}</span></div>`).join('');
    document.execCommand('insertHTML', false, `<div class="chart-container">${bars}</div>`);
    
    // Animate bars
    setTimeout(() => {
        document.querySelectorAll('.chart-bar').forEach(bar => {
            bar.style.height = bar.dataset.height + '%';
        });
    }, 50);
    syncContent();
}

function summarizeText() {
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.toString().trim() === '') return showToast('Highlight text first!');
    const sentences = sel.toString().split(/[.\n]/).map(s => s.trim()).filter(s => s.length > 0);
    if(sentences.length === 0) return;
    document.execCommand('insertHTML', false, `<ul>${sentences.map(s => `<li>${s}</li>`).join('')}</ul>`);
    syncContent();
}

function generateAgenda() {
    const items = state.slides.map((s, i) => `<li>${s.title.replace(/<[^>]*>?/gm, '').trim() || `Slide ${i+1}`}</li>`).join('');
    document.execCommand('insertHTML', false, `<h2><b>Agenda</b></h2><ul>${items}</ul>`);
    syncContent();
}

function magicLayout() {
    const text = bodyArea.innerText.trim();
    const words = text.split(/\s+/);
    if (words.length <= 15) { bodyArea.innerHTML = `<p class="magic-quote">${text}</p>`; } 
    else if (text.includes('\n')) {
        const items = text.split('\n').filter(t => t.trim() !== '').map(t => `<p>${t}</p>`).join('');
        bodyArea.innerHTML = `<div class="magic-grid">${items}</div>`;
    } else {
        const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
        const chunkSize = Math.ceil(sentences.length / 3);
        let cols = '';
        for (let i = 0; i < 3; i++) { cols += `<div>${sentences.slice(i * chunkSize, (i + 1) * chunkSize).join(' ')}</div>`; }
        bodyArea.innerHTML = `<div class="magic-grid">${cols}</div>`;
    }
    syncContent();
    showToast('✨ Magic Layout applied!');
}

// --- EXPORTS & SHARING ---
function generateShareLink() {
    const cleanState = JSON.parse(JSON.stringify(state));
    cleanState.slides.forEach(s => { s.body = s.body.replace(/<img[^>]*>/g, "[Image removed for sharing]"); });
    try {
        const encoded = btoa(encodeURIComponent(JSON.stringify(cleanState)));
        const url = `${window.location.origin}${window.location.pathname}?data=${encoded}`;
        navigator.clipboard.writeText(url).then(() => showToast('🔗 Share link copied!')).catch(() => prompt('Copy this link:', url));
    } catch(e) { showToast('Too large to share via link.'); }
}

function exportHTML() {
    const data = btoa(encodeURIComponent(JSON.stringify(state)));
    const htmlContent = `<!DOCTYPE html><html><head><title>Presentation</title><style>body{margin:0;background:#000;overflow:hidden;font-family:sans-serif;}#slide{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:5vw;box-sizing:border-box;}.title{font-size:4vw;color:#F59E0B;margin-bottom:2vw;font-weight:800;}.body{font-size:2vw;color:#fff;line-height:1.5;white-space:pre-wrap;}.sunset{background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 100%)}.ocean{background:linear-gradient(120deg,#a1c4fd 0%,#c2e9fb 100%)}.forest{background:linear-gradient(120deg,#d4fc79 0%,#96e6a1 100%)}.midnight{background:linear-gradient(120deg,#2c3e50 0%,#4ca1af 100%)}</style></head><body><div id="slide"><div class="title" id="t"></div><div class="body" id="b"></div></div><script>const state=JSON.parse(decodeURIComponent(atob('${data}')));let i=0;const t=document.getElementById('t'),b=document.getElementById('b'),s=document.getElementById('slide');function render(){const sl=state.slides[i];s.className=sl.bg!=='default'?'bg-'+sl.bg:'';t.innerHTML=sl.title||'';b.innerHTML=sl.body||'';}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')i=Math.min(i+1,state.slides.length-1);if(e.key==='ArrowLeft')i=Math.max(i-1,0);render();});render();<\/script></body></html>`;
    const blob = new Blob([htmlContent], {type: 'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'presentation.html';
    a.click();
    showToast('📦 Standalone HTML exported!');
}

function exportPDF() {
    const printArea = document.getElementById('print-area'); printArea.innerHTML = '';
    state.slides.forEach(slide => {
        const div = document.createElement('div');
        div.className = 'print-slide slide-canvas ' + (slide.bg !== 'default' ? slide.bg : '');
        div.style.setProperty('--accent', state.globalStyles.accent);
        div.style.setProperty('--title-font', state.globalStyles.font);
        div.innerHTML = `<div class="slide-title">${slide.title || ''}</div><div class="slide-body">${slide.body || ''}</div>`;
        printArea.appendChild(div);

}

function exportPPTX() {
    let pptx = new PptxGenJS();
    pptx.defineLayout({ name: 'CUSTOM', width: 10, height: 5.625 }); // 16:9
    pptx.layout = 'CUSTOM';

    state.slides.forEach(slide => {
        let s = pptx.addSlide();
        let bgColor = 'FFFFFF';
        let textColor = '1A1D21';
        let titleColor = 'F59E0B';

        if(slide.bg === 'bg-sunset') bgColor = 'FECFEF';
        else if(slide.bg === 'bg-ocean') bgColor = 'C2E9FB';
        else if(slide.bg === 'bg-forest') bgColor = '96E6A1';
        else if(slide.bg === 'bg-midnight') { bgColor = '2C3E50'; textColor = 'FFFFFF'; titleColor = 'FFFFFF'; }
        
        s.background = { color: bgColor };
        
        // Extract plain text for title and body
        const titleText = slide.title.replace(/<[^>]*>?/gm, '');
        const bodyText = slide.body.replace(/<[^>]*>?/gm, '\n').replace(/\n+/g, '\n').trim();
        
        if(titleText) s.addText(titleText, { x: 0.5, y: 0.5, w: 9, h: 1, fontSize: 32, color: titleColor, bold: true, fontFace: 'Arial' });
        if(bodyText) s.addText(bodyText, { x: 0.5, y: 1.5, w: 9, h: 3.5, fontSize: 18, color: textColor, fontFace: 'Arial', valign: 'top' });
    });

    pptx.writeFile({ fileName: 'PosterPr3s_Presentation.pptx' });
    showToast('📄 Exporting to PowerPoint...');
}

// --- IMAGE PASTE ---
function handleImageInsert(file) { if (!file || !file.type.startsWith('image/')) return; const reader = new FileReader(); reader.onload = (event) => execCmd('insertImage', event.target.result); reader.readAsDataURL(file); }
canvas.addEventListener('dragover', (e) => e.preventDefault());
canvas.addEventListener('drop', (e) => { e.preventDefault(); handleImageInsert(e.dataTransfer.files[0]); });
canvas.addEventListener('paste', (e) => { for (let i = 0; i < e.clipboardData.items.length; i++) { if (e.clipboardData.items[i].type.startsWith('image/')) { e.preventDefault(); handleImageInsert(e.clipboardData.items[i].getAsFile()); return; } } });

// --- MARKDOWN ---
bodyArea.addEventListener('keyup', (e) => {
    const text = bodyArea.innerText;
    if (e.key === ' ') {
        if (text.startsWith('# ')) { bodyArea.innerHTML = bodyArea.innerHTML.replace('# ', ''); document.execCommand('formatBlock', false, 'h1'); } 
        else if (text.startsWith('- ')) { document.execCommand('insertUnorderedList'); bodyArea.innerHTML = bodyArea.innerHTML.replace('- ', ''); } 
        else if (text.startsWith('``` ')) { bodyArea.innerHTML = bodyArea.innerHTML.replace('``` ', ''); document.execCommand('formatBlock', false, 'pre'); }

    playClick(); syncContent();
});
titleArea.addEventListener('keyup', () => { playClick(); syncContent(); });
notesArea.addEventListener('keyup', syncContent);

// --- PRESENT MODE ---
let presentIndex = 0, presentTimerInterval, presentStartTime, laserOn = false, autoPlayOn = false, autoPlayInterval, drawMode = null;

function startPresentation() {
    presentIndex = state.currentSlide; presentMode.style.display = 'flex'; renderPresentSlide();
    presentStartTime = Date.now(); presentTimerInterval = setInterval(updateTimer, 1000);
    resizeDrawCanvas(); closeCmdk();
}
function updateTimer() { const e = Math.floor((Date.now() - presentStartTime) / 1000); document.getElementById('presentTimer').textContent = `${Math.floor(e / 60).toString().padStart(2, '0')}:${(e % 60).toString().padStart(2, '0')}`; }
function exitPresentation() { presentMode.style.display = 'none'; clearInterval(presentTimerInterval); toggleLaser(false); toggleVoice(false); toggleAutoPlay(false); clearDrawing(); }
function renderPresentSlide() {
    const slide = state.slides[presentIndex];
    const pSlide = document.getElementById('presentSlide');
    pSlide.style.animation = 'none'; pSlide.offsetHeight; 
    pSlide.style.animation = `${slide.transition || 'fadeAnim'} 0.6s ease forwards`;
    pSlide.className = 'present-slide ' + (slide.bg !== 'default' ? slide.bg : '');
    document.getElementById('presentTitle').innerHTML = slide.title || "Untitled Slide";
    document.getElementById('presentBody').innerHTML = slide.body || "";
    document.getElementById('presentProgress').style.width = `${((presentIndex + 1) / state.slides.length) * 100}%`;
    clearDrawing(); // Clear drawing when slide changes
}
function nextPresentSlide() { if (presentIndex < state.slides.length - 1) { presentIndex++; renderPresentSlide(); } else if (autoPlayOn) { presentIndex = 0; renderPresentSlide(); } }
function prevPresentSlide() { if (presentIndex > 0) { presentIndex--; renderPresentSlide(); } }

function toggleLaser(forceState) { laserOn = forceState !== undefined ? forceState : !laserOn; laserPointer.style.display = laserOn ? 'block' : 'none'; document.getElementById('laserBtn').classList.toggle('active', laserOn); }
document.addEventListener('mousemove', (e) => { if (laserOn && presentMode.style.display === 'flex') { laserPointer.style.left = e.clientX + 'px'; laserPointer.style.top = e.clientY + 'px'; } });

function toggleAutoPlay(forceState) {
    autoPlayOn = forceState !== undefined ? forceState : !autoPlayOn;
    document.getElementById('autoPlayBtn').classList.toggle('active', autoPlayOn);
    if (autoPlayOn) {
        autoPlayInterval = setInterval(() => {
            if (presentIndex < state.slides.length - 1) { presentIndex++; renderPresentSlide(); }
            else { presentIndex = 0; renderPresentSlide(); } // Loop
        }, 5000);
        showToast('⏳ Auto-play on (5s)');
    } else {
        clearInterval(autoPlayInterval);
    }
}

// --- DRAWING / ANNOTATIONS ---
function resizeDrawCanvas() { drawCanvas.width = window.innerWidth; drawCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizeDrawCanvas);

function toggleDraw(mode) {
    drawMode = (drawMode === mode) ? null : mode;
    document.getElementById('penBtn').classList.toggle('active', drawMode === 'pen');
    document.getElementById('highlightBtn').classList.toggle('active', drawMode === 'highlighter');
    drawCanvas.style.display = drawMode ? 'block' : 'none';
    if (drawMode === 'pen') drawCtx.globalCompositeOperation = 'source-over';
    else if (drawMode === 'highlighter') drawCtx.globalCompositeOperation = 'multiply';
}

function clearDrawing() { drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); }

let isDrawing = false, lastX = 0, lastY = 0;
drawCanvas.addEventListener('mousedown', (e) => { isDrawing = true; [lastX, lastY] = [e.offsetX, e.offsetY]; });
drawCanvas.addEventListener('mouseup', () => isDrawing = false);
drawCanvas.addEventListener('mouseleave', () => isDrawing = false);
drawCanvas.addEventListener('mousemove', (e) => {
    if (!isDrawing || !drawMode) return;
    drawCtx.beginPath();
    drawCtx.moveTo(lastX, lastY);
    drawCtx.lineTo(e.offsetX, e.offsetY);
    drawCtx.strokeStyle = state.globalStyles.accent;
    drawCtx.lineWidth = drawMode === 'highlighter' ? 15 : 3;
    drawCtx.lineCap = 'round';
    drawCtx.globalAlpha = drawMode === 'highlighter' ? 0.3 : 1;
    drawCtx.stroke();
    [lastX, lastY] = [e.offsetX, e.offsetY];
});

// --- CONFETTI ---
const confettiCanvas = document.getElementById('confettiCanvas');
const ctx = confettiCanvas.getContext('2d');
let confettiParticles = [];
function resizeConfetti() { confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizeConfetti); resizeConfetti();

function triggerConfetti() {
    for (let i = 0; i < 150; i++) {
        confettiParticles.push({ x: window.innerWidth / 2, y: window.innerHeight / 2, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20 - 5, color: `hsl(${Math.random() * 360}, 100%, 50%)`, size: Math.random() * 8 + 2, life: 1 });
    }
}
function updateConfetti() {
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiParticles = confettiParticles.filter(p => p.life > 0);
    confettiParticles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.015; ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
    requestAnimationFrame(updateConfetti);
}
updateConfetti();

// --- VOICE CONTROL ---
let recognition = null, voiceOn = false;
function toggleVoice(forceState) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return showToast('Voice control not supported in this browser.');
    voiceOn = forceState !== undefined ? forceState : !voiceOn;
    document.getElementById('voiceBtn').classList.toggle('active', voiceOn);
    if (voiceOn) {
        recognition = new SpeechRecognition();
        recognition.continuous = true; recognition.interimResults = false; recognition.lang = 'en-US';
        recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
            if (transcript.includes('next')) nextPresentSlide();
            else if (transcript.includes('previous') || transcript.includes('back')) prevPresentSlide();
            else if (transcript.includes('laser')) toggleLaser();
            else if (transcript.includes('confetti')) triggerConfetti();
            else if (transcript.includes('pen')) toggleDraw('pen');
            else if (transcript.includes('clear')) clearDrawing();
            else if (transcript.includes('exit')) exitPresentation();
        };
        recognition.start();
        showToast('🎤 Voice control active. Say "next" or "pen".');
    } else { if (recognition) recognition.stop(); showToast('Voice control off.'); }
}

const commands = [
    { name: 'Add New Slide', action: addSlide }, { name: 'Start Presentation', action: startPresentation },
    { name: 'Generate Chart', action: generateChart }, { name: 'Apply Magic Layout', action: magicLayout },
    { name: 'Open Brand Kit', action: openBrandKit }, { name: 'Open Snapshots', action: openSnapshots },
    { name: 'Generate Share Link', action: generateShareLink }, { name: 'Export to PDF', action: exportPDF },
    { name: 'Export to HTML', action: exportHTML }, { name: 'Export to PowerPoint', action: exportPPTX },
    { name: 'Toggle Grid View', action: toggleGridView }, { name: 'Toggle Dark Mode', action: toggleTheme },
    { name: 'Toggle Zen Mode', action: toggleZenMode }, { name: 'Toggle Speaker Notes', action: toggleNotes },
    { name: 'Summarize Selected Text', action: summarizeText }, { name: 'Generate Agenda Slide', action: generateAgenda },
    { name: 'Duplicate Current Slide', action: () => duplicateSlide(state.currentSlide) }, { name: 'Delete Current Slide', action: () => deleteSlide(state.currentSlide) }
];
function openCmdk() { document.getElementById('cmdkOverlay').style.display = 'flex'; document.getElementById('cmdkInput').value = ''; renderCmdkResults(''); setTimeout(() => document.getElementById('cmdkInput').focus(), 50); }
function closeCmdk() { document.getElementById('cmdkOverlay').style.display = 'none'; }
function filterCmdk() { renderCmdkResults(document.getElementById('cmdkInput').value.toLowerCase()); }
function renderCmdkResults(query) {
    const resultsDiv = document.getElementById('cmdkResults');
    resultsDiv.innerHTML = commands.filter(c => c.name.toLowerCase().includes(query)).map(c => `<div class="cmdk-item" onclick="commands[${commands.indexOf(c)}].action()"><span>${c.name}</span></div>`).join('');
    if (resultsDiv.innerHTML === '') resultsDiv.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--ink2);">No commands found</div>';
}

// --- SHORTCUTS ---
document.addEventListener('keydown', (e) => {
    const isTyping = e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT';
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); if (document.getElementById('cmdkOverlay').style.display === 'flex') closeCmdk(); else openCmdk(); return; }
    if (document.getElementById('cmdkOverlay').style.display === 'flex') { if (e.key === 'Escape') closeCmdk(); return; }
    if (document.getElementById('gridView').classList.contains('active')) { if (e.key === 'Escape') toggleGridView(); return; }
    if (presentMode.style.display === 'flex') {
        if (e.key === 'ArrowRight' || e.key === ' ') { if(!drawMode) nextPresentSlide(); }
        if (e.key === 'ArrowLeft') { if(!drawMode) prevPresentSlide(); }
        if (e.key === 'Escape') exitPresentation();
        if (e.key === 'l' || e.key === 'L') toggleLaser();
        if (e.key === 'v' || e.key === 'V') toggleVoice();
        if (e.key === 'c' || e.key === 'C') triggerConfetti();
        if (e.key === 'd' || e.key === 'D') toggleDraw('pen');
        if (e.key === 'h' || e.key === 'H') toggleDraw('highlighter');
        if (e.key === 'a' || e.key === 'A') toggleAutoPlay();
    } else if (!isTyping) {
        if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); startPresentation(); }
        if (e.ctrlKey && e.key === 'n') { e.preventDefault(); addSlide(); }
        if (e.ctrlKey && e.shiftKey && e.key === 'N') { e.preventDefault(); toggleNotes(); }
        if (e.ctrlKey && e.key === 'd') { e.preventDefault(); toggleTheme(); }
        if (e.ctrlKey && e.key === 'z') { e.preventDefault(); toggleZenMode(); }
        if (e.ctrlKey && e.key === 'p') { e.preventDefault(); exportPDF(); }
    }
});

function toggleTheme() { 
    document.documentElement.classList.toggle('dark-mode'); 
    localStorage.setItem('pp3-theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light'); 
    closeCmdk(); 
}
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

// --- EXTERNAL EVENT LISTENER (e.g., from parent window/iframe) ---
window.addEventListener('message', function(event) {
    if (event.data.type === 'theme-update') {
        if (event.data.dark) {
            document.documentElement.classList.add('dark-mode');
            // Update the app's internal toggle state/localStorage if needed
            localStorage.setItem('pp3-theme', 'dark');
        } else {
            document.documentElement.classList.remove('dark-mode');
            localStorage.setItem('pp3-theme', 'light');
        }
    }
    if (event.data.type === 'calm-update') {
        if (event.data.calm) {
            document.documentElement.classList.add('calm-mode');
        } else {
            document.documentElement.classList.remove('calm-mode');
        }
    }
});

init();
</script>
