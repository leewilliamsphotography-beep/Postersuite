<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="2.0">
<title>PosterPr3s — Presentation Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --paper:#F8F9FA; --surface:#FFFFFF; --ink:#1A1D21; --ink2:#50545C; --line:#E3E5E8; --accent:#F59E0B; --shadow: 0 10px 30px rgba(0,0,0,0.08); }
body.dark-mode { --paper:#121212; --surface:#1E1E1E; --ink:#E8E8E8; --ink2:#A0A0A0; --line:#333333; --shadow: 0 10px 30px rgba(0,0,0,0.5); }
* { box-sizing:border-box; margin:0; padding:0; font-family:'Lexend',sans-serif; }
body { background:var(--paper); color:var(--ink); height:100vh; display:flex; flex-direction:column; transition:background .2s; overflow: hidden; }

/* Header */
header { display:flex; justify-content:space-between; align-items:center; padding:12px 24px; background:var(--surface); border-bottom:1px solid var(--line); z-index: 10; }
.logo { font-family:'Bricolage Grotesque'; font-weight:800; color:var(--accent); text-decoration:none; font-size: 1.2rem; }
.toolbar { display:flex; gap:8px; align-items: center; }
.btn { background:var(--accent); color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer; font-family:'Bricolage Grotesque'; transition: 0.2s; display: flex; align-items: center; gap: 6px;}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
.btn-secondary { background:transparent; border:1px solid var(--line); color:var(--ink); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }

/* Layout */
.main { flex:1; display:flex; overflow: hidden; transition: all 0.3s ease; }
.sidebar { width:240px; background:var(--surface); border-right:1px solid var(--line); padding:16px; overflow-y:auto; display: flex; flex-direction: column; gap: 10px; transition: width 0.3s ease, padding 0.3s ease; }
.main.zen-mode .sidebar { width: 0; padding: 0; border: none; overflow: hidden; }

.canvas-area { flex:1; padding:40px; display:flex; flex-direction: column; align-items:center; justify-content:center; position: relative; transition: padding 0.3s ease; }
.main.zen-mode .canvas-area { padding: 80px; }

/* Editor Toolbar */
.editor-toolbar { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; gap: 4px; margin-bottom: 20px; box-shadow: var(--shadow); transition: opacity 0.2s, transform 0.2s; }
.main.zen-mode .editor-toolbar { opacity: 0; transform: translateY(-20px); pointer-events: none; }
.editor-btn { background: transparent; border: none; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; color: var(--ink2); font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
.editor-btn:hover { background: var(--paper); color: var(--accent); }
.editor-btn.active { background: var(--accent); color: #fff; }
.color-input { width: 36px; height: 36px; border: none; background: transparent; cursor: pointer; border-radius: 6px; padding: 0; }

/* Slides */
.slide-thumb { background:var(--paper); border:2px solid transparent; border-radius:8px; height:90px; margin-bottom:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:600; color:var(--ink2); position: relative; transition: 0.2s; padding: 10px; text-align: center; overflow: hidden; }
.slide-thumb:hover { border-color: var(--line); }
.slide-thumb.active { border-color:var(--accent); color: var(--accent); }
.thumb-controls { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; opacity: 0; transition: 0.2s; }
.slide-thumb:hover .thumb-controls { opacity: 1; }
.thumb-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; width: 20px; height: 20px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); }

/* Canvas */
.slide-canvas { width:800px; height:450px; background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:50px; display:flex; flex-direction:column; justify-content:center; transition: background 0.5s ease; position: relative; overflow: hidden; }
.slide-title { font-family:'Bricolage Grotesque'; font-size:42px; margin-bottom:20px; color:var(--accent); outline:none; line-height: 1.1; }
.slide-body { font-size:22px; line-height:1.6; color:var(--ink); outline:none; flex: 1; }
.slide-body ul, .slide-body ol { padding-left: 20px; }

/* Dynamic Gradients */
.bg-sunset { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
.bg-ocean { background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%); }
.bg-forest { background: linear-gradient(120deg, #d4fc79 0%, #96e6a1 100%); }
.bg-midnight { background: linear-gradient(120deg, #2c3e50 0%, #4ca1af 100%); color: white; }
.bg-midnight .slide-title, .bg-midnight .slide-body { color: #fff; }

/* Speaker Notes */
.notes-panel { width: 800px; height: 0; background: var(--surface); border-radius: 12px; margin-top: 20px; overflow: hidden; transition: height 0.3s ease, padding 0.3s ease; box-shadow: var(--shadow); border: 1px solid var(--line); display: flex; flex-direction: column; }
.notes-panel.active { height: 150px; }
.notes-header { padding: 10px 16px; border-bottom: 1px solid var(--line); font-weight: 600; color: var(--ink2); display: flex; justify-content: space-between; align-items: center; font-family: 'Bricolage Grotesque'; }
.notes-area { flex: 1; padding: 16px; outline: none; color: var(--ink2); font-size: 14px; resize: none; border: none; background: transparent; }

/* Present Mode */
.present-mode { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
.present-slide { width: 80vw; height: 45vw; padding: 5vw; display: flex; flex-direction: column; justify-content: center; position: absolute; }
.present-title { font-family:'Bricolage Grotesque'; font-size: 4vw; margin-bottom: 2vw; color: #F59E0B; }
.present-body { font-size: 2vw; line-height: 1.5; color: #fff; white-space: pre-wrap; }
.present-controls { position: fixed; bottom: 30px; display: flex; gap: 10px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 50px; backdrop-filter: blur(10px); z-index: 10; }
.present-controls button { background: rgba(255,255,255,0.2); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 16px; }
.present-notes { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 80vw; color: rgba(255,255,255,0.5); font-size: 14px; text-align: center; }

/* Transitions */
@keyframes fadeAnim { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideLeftAnim { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes zoomAnim { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes flipAnim { from { transform: perspective(1000px) rotateY(90deg); opacity: 0; } to { transform: perspective(1000px) rotateY(0deg); opacity: 1; } }

/* Command Palette */
.cmdk-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: flex-start; justify-content: center; padding-top: 15vh; }
.cmdk-modal { width: 500px; background: var(--surface); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); overflow: hidden; border: 1px solid var(--line); }
.cmdk-input { width: 100%; padding: 16px 20px; border: none; border-bottom: 1px solid var(--line); font-size: 16px; background: transparent; color: var(--ink); outline: none; }
.cmdk-results { max-height: 300px; overflow-y: auto; padding: 8px; }
.cmdk-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--ink); }
.cmdk-item:hover, .cmdk-item.active { background: var(--paper); }
.cmdk-item span { font-size: 12px; color: var(--ink2); margin-left: auto; background: var(--paper); padding: 2px 6px; border-radius: 4px; }

/* Toast */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: var(--surface); padding: 12px 24px; border-radius: 8px; box-shadow: var(--shadow); transition: transform 0.3s; z-index: 2000; font-weight: 600; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* Placeholders */
[contenteditable=true]:empty:before { content: attr(data-ph); color: #aaa; font-style: italic; }
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo">← PosterPr3s</a>
    <div class="toolbar">
        <button class="btn btn-secondary" onclick="toggleZenMode()">🧘 Zen Mode</button>
        <button class="btn btn-secondary" onclick="toggleNotes()">📝 Notes</button>
        <button class="btn btn-secondary" onclick="openCmdk()">⌘ Commands</button>
        <button class="btn btn-secondary" onclick="toggleTheme()">🌓 Theme</button>
        <button class="btn btn-secondary" onclick="addSlide()">+ New Slide</button>
        <button class="btn" onclick="startPresentation()">▶ Present</button>
    </div>
</header>

<div class="main" id="mainContainer">
    <div class="sidebar" id="sidebar"></div>
    <div class="canvas-area">
        <div class="editor-toolbar">
            <button class="editor-btn" onclick="execCmd('bold')"><b>B</b></button>
            <button class="editor-btn" onclick="execCmd('italic')"><i>I</i></button>
            <button class="editor-btn" onclick="execCmd('underline')"><u>U</u></button>
            <button class="editor-btn" onclick="execCmd('insertUnorderedList')">• List</button>
            <input type="color" class="color-input" onchange="execCmd('foreColor', this.value)" title="Text Color">
            <div style="width: 1px; background: var(--line); margin: 0 8px;"></div>
            <button class="editor-btn" onclick="changeBg('default')" title="Default">⬜</button>
            <button class="editor-btn" onclick="changeBg('bg-sunset')" title="Sunset">🌅</button>
            <button class="editor-btn" onclick="changeBg('bg-ocean')" title="Ocean">🌊</button>
            <button class="editor-btn" onclick="changeBg('bg-forest')" title="Forest">🌲</button>
            <button class="editor-btn" onclick="changeBg('bg-midnight')" title="Midnight">🌙</button>
            <div style="width: 1px; background: var(--line); margin: 0 8px;"></div>
            <button class="editor-btn" onclick="changeTransition('fade')" title="Fade Transition">fade</button>
            <button class="editor-btn" onclick="changeTransition('slideLeftAnim')" title="Slide Transition">slide</button>
            <button class="editor-btn" onclick="changeTransition('zoomAnim')" title="Zoom Transition">zoom</button>
            <button class="editor-btn" onclick="changeTransition('flipAnim')" title="Flip Transition">flip</button>
        </div>
        <div class="slide-canvas" id="canvas">
            <div class="slide-title" id="titleArea" contenteditable="true" data-ph="Slide Title"></div>
            <div class="slide-body" id="bodyArea" contenteditable="true" data-ph="Start typing your brilliant ideas here..."></div>
        </div>
        <div class="notes-panel" id="notesPanel">
            <div class="notes-header">
                <span>Speaker Notes</span>
                <button onclick="toggleNotes()" style="background:none; border:none; cursor:pointer; color:var(--ink2);">✖</button>
            </div>
            <textarea class="notes-area" id="notesArea" placeholder="Write your speaker notes here..."></textarea>
        </div>
    </div>
</div>

<!-- Command Palette -->
<div class="cmdk-overlay" id="cmdkOverlay" onclick="if(event.target === this) closeCmdk()">
    <div class="cmdk-modal">
        <input type="text" class="cmdk-input" id="cmdkInput" placeholder="Type a command or search..." oninput="filterCmdk()" autofocus>
        <div class="cmdk-results" id="cmdkResults"></div>
    </div>
</div>

<!-- Presentation Mode Overlay -->
<div class="present-mode" id="presentMode">
    <div class="present-slide" id="presentSlide">
        <div class="present-title" id="presentTitle"></div>
        <div class="present-body" id="presentBody"></div>
    </div>
    <div class="present-notes" id="presentNotes"></div>
    <div class="present-controls">
        <button onclick="prevPresentSlide()">◀</button>
        <button onclick="exitPresentation()">✖</button>
        <button onclick="nextPresentSlide()">▶</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// State Management
let state = { slides: [], currentSlide: 0 };
const sidebar = document.getElementById('sidebar');
const titleArea = document.getElementById('titleArea');
const bodyArea = document.getElementById('bodyArea');
const notesArea = document.getElementById('notesArea');
const canvas = document.getElementById('canvas');
const mainContainer = document.getElementById('mainContainer');

// Web Audio API for Typewriter Sounds
let audioCtx;
function playClick() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = Math.random() * 100 + 600;
    o.type = 'square';
    g.gain.setValueAtTime(0.02, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    o.start(); o.stop(audioCtx.currentTime + 0.05);
}

// Initialize
function init() {
    const saved = localStorage.getItem('posterprs_data');
    if (saved) {
        state = JSON.parse(saved);
        // Backward compatibility for new fields
        state.slides.forEach(s => { if(!s.transition) s.transition = 'fade'; if(!s.notes) s.notes = ''; });
    } else {
        state.slides = [{ id: Date.now(), title: '', body: '', bg: 'default', transition: 'fade', notes: '' }];
    }
    renderSidebar();
    loadSlide(0);
}

// Auto-save
let saveTimeout;
function autoSave() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        localStorage.setItem('posterprs_data', JSON.stringify(state));
        showToast('✓ Auto-saved');
    }, 1000);
}

// Sync content to state
function syncContent() {
    if (!state.slides[state.currentSlide]) return;
    state.slides[state.currentSlide].title = titleArea.innerHTML;
    state.slides[state.currentSlide].body = bodyArea.innerHTML;
    state.slides[state.currentSlide].notes = notesArea.value;
    autoSave();
    updateThumb(state.currentSlide);
}

// Slide Management
function addSlide() {
    state.slides.push({ id: Date.now(), title: '', body: '', bg: 'default', transition: 'fade', notes: '' });
    renderSidebar();
    loadSlide(state.slides.length - 1);
    closeCmdk();
}

function deleteSlide(index) {
    if (state.slides.length <= 1) return showToast("Can't delete the only slide!");
    state.slides.splice(index, 1);
    if (state.currentSlide >= state.slides.length) state.currentSlide = state.slides.length - 1;
    renderSidebar();
    loadSlide(state.currentSlide);
    closeCmdk();
}

function duplicateSlide(index) {
    const original = state.slides[index];
    const copy = { ...original, id: Date.now(), title: original.title, body: original.body, notes: original.notes };
    state.slides.splice(index + 1, 0, copy);
    renderSidebar();
    loadSlide(index + 1);
    closeCmdk();
}

function renderSidebar() {
    sidebar.innerHTML = '';
    state.slides.forEach((slide, index) => {
        const thumb = document.createElement('div');
        thumb.className = 'slide-thumb' + (index === state.currentSlide ? ' active' : '');
        thumb.style.background = getGradientCSS(slide.bg);
        thumb.innerHTML = `
            <span style="font-size: 12px; z-index: 2;">${slide.title.replace(/<[^>]*>?/gm, '').substring(0, 20) || 'Slide ' + (index + 1)}</span>
            <div class="thumb-controls">
                <button class="thumb-btn" onclick="event.stopPropagation(); duplicateSlide(${index})" title="Duplicate">⧉</button>
                <button class="thumb-btn" onclick="event.stopPropagation(); deleteSlide(${index})" title="Delete">🗑</button>
            </div>
        `;
        thumb.onclick = () => loadSlide(index);
        sidebar.appendChild(thumb);
    });
}

function updateThumb(index) {
    const thumb = sidebar.children[index];
    if(thumb) thumb.querySelector('span').textContent = state.slides[index].title.replace(/<[^>]*>?/gm, '').substring(0, 20) || 'Slide ' + (index + 1);
}

function getGradientCSS(bg) {
    switch(bg) {
        case 'bg-sunset': return 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%)';
        case 'bg-ocean': return 'linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%)';
        case 'bg-forest': return 'linear-gradient(120deg, #d4fc79 0%, #96e6a1 100%)';
        case 'bg-midnight': return 'linear-gradient(120deg, #2c3e50 0%, #4ca1af 100%)';
        default: return 'var(--paper)';
    }
}

// Load slide into editor
function loadSlide(index) {
    state.currentSlide = index;
    const slide = state.slides[index];
    canvas.className = 'slide-canvas';
    if (slide.bg !== 'default') canvas.classList.add(slide.bg);
    
    titleArea.innerHTML = slide.title;
    bodyArea.innerHTML = slide.body;
    notesArea.value = slide.notes || '';
    
    renderSidebar();
}

// Editor Commands
function execCmd(command, value = null) {
    document.execCommand(command, false, value);
    syncContent();
}

function changeBg(bg) {
    state.slides[state.currentSlide].bg = bg;
    canvas.className = 'slide-canvas';
    if (bg !== 'default') canvas.classList.add(bg);
    autoSave();
    renderSidebar();
}

function changeTransition(trans) {
    state.slides[state.currentSlide].transition = trans;
    autoSave();
    showToast(`Transition set to: ${trans}`);
}

// Zen Mode & Notes Toggle
function toggleZenMode() {
    mainContainer.classList.toggle('zen-mode');
}
function toggleNotes() {
    document.getElementById('notesPanel').classList.toggle('active');
}

// Markdown auto-formatting
bodyArea.addEventListener('keyup', (e) => {
    const text = bodyArea.innerText;
    if (e.key === ' ') {
        if (text.startsWith('# ')) {
            bodyArea.innerHTML = bodyArea.innerHTML.replace('# ', '');
            document.execCommand('formatBlock', false, 'h1');
        } else if (text.startsWith('- ')) {
            document.execCommand('insertUnorderedList');
            bodyArea.innerHTML = bodyArea.innerHTML.replace('- ', '');
        }
    }
    playClick();
    syncContent();
});

titleArea.addEventListener('keyup', () => { playClick(); syncContent(); });
notesArea.addEventListener('keyup', syncContent);

// Presentation Mode
let presentIndex = 0;
function startPresentation() {
    presentIndex = state.currentSlide;
    document.getElementById('presentMode').style.display = 'flex';
    renderPresentSlide();
    closeCmdk();
}

function exitPresentation() {
    document.getElementById('presentMode').style.display = 'none';
}

function renderPresentSlide() {
    const slide = state.slides[presentIndex];
    const pSlide = document.getElementById('presentSlide');
    
    // Reset animation
    pSlide.style.animation = 'none';
    pSlide.offsetHeight; // trigger reflow
    pSlide.style.animation = `${slide.transition || 'fadeAnim'} 0.6s ease forwards`;
    
    pSlide.className = 'present-slide ' + (slide.bg !== 'default' ? slide.bg : '');
    document.getElementById('presentTitle').innerHTML = slide.title || "Untitled Slide";
    document.getElementById('presentBody').innerHTML = slide.body || "";
    document.getElementById('presentNotes').innerText = slide.notes || "";
}

function nextPresentSlide() {
    if (presentIndex < state.slides.length - 1) { presentIndex++; renderPresentSlide(); }
}
function prevPresentSlide() {
    if (presentIndex > 0) { presentIndex--; renderPresentSlide(); }
}

// Command Palette Logic
const commands = [
    { name: 'Add New Slide', action: addSlide, shortcut: 'Ctrl+N' },
    { name: 'Start Presentation', action: startPresentation, shortcut: 'Ctrl+Enter' },
    { name: 'Toggle Dark Mode', action: toggleTheme, shortcut: 'Ctrl+D' },
    { name: 'Toggle Zen Mode', action: toggleZenMode, shortcut: 'Ctrl+Z' },
    { name: 'Toggle Speaker Notes', action: toggleNotes, shortcut: 'Ctrl+Shift+N' },
    { name: 'Duplicate Current Slide', action: () => duplicateSlide(state.currentSlide) },
    { name: 'Delete Current Slide', action: () => deleteSlide(state.currentSlide) },
    { name: 'Apply Sunset Background', action: () => changeBg('bg-sunset') },
    { name: 'Apply Ocean Background', action: () => changeBg('bg-ocean') },
    { name: 'Apply Forest Background', action: () => changeBg('bg-forest') },
    { name: 'Apply Midnight Background', action: () => changeBg('bg-midnight') },
    { name: 'Set Transition: Fade', action: () => changeTransition('fadeAnim') },
    { name: 'Set Transition: Slide', action: () => changeTransition('slideLeftAnim') },
    { name: 'Set Transition: Zoom', action: () => changeTransition('zoomAnim') },
    { name: 'Set Transition: Flip', action: () => changeTransition('flipAnim') }
];

function openCmdk() {
    document.getElementById('cmdkOverlay').style.display = 'flex';
    document.getElementById('cmdkInput').value = '';
    renderCmdkResults('');
    setTimeout(() => document.getElementById('cmdkInput').focus(), 50);
}

function closeCmdk() {
    document.getElementById('cmdkOverlay').style.display = 'none';
}

function filterCmdk() {
    const query = document.getElementById('cmdkInput').value.toLowerCase();
    renderCmdkResults(query);
}

function renderCmdkResults(query) {
    const resultsDiv = document.getElementById('cmdkResults');
    const filtered = commands.filter(cmd => cmd.name.toLowerCase().includes(query));
    
    resultsDiv.innerHTML = filtered.map((cmd, i) => `
        <div class="cmdk-item" onclick="commands[${commands.indexOf(cmd)}].action()">
            <span>${cmd.name}</span>
            ${cmd.shortcut ? `<span>${cmd.shortcut}</span>` : ''}
        </div>
    `).join('');
    
    if (filtered.length === 0) {
        resultsDiv.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--ink2);">No commands found</div>';
    }
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
    // Command Palette
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        if (document.getElementById('cmdkOverlay').style.display === 'flex') closeCmdk();
        else openCmdk();
        return;
    }

    if (document.getElementById('cmdkOverlay').style.display === 'flex') {
        if (e.key === 'Escape') closeCmdk();
        return;
    }

    if (document.getElementById('presentMode').style.display === 'flex') {
        if (e.key === 'ArrowRight' || e.key === ' ') nextPresentSlide();
        if (e.key === 'ArrowLeft') prevPresentSlide();
        if (e.key === 'Escape') exitPresentation();
    } else {
        if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); startPresentation(); }
        if (e.ctrlKey && e.key === 'n') { e.preventDefault(); addSlide(); }
        if (e.ctrlKey && e.shiftKey && e.key === 'N') { e.preventDefault(); toggleNotes(); }
        if (e.ctrlKey && e.key === 'd') { e.preventDefault(); toggleTheme(); }
        if (e.ctrlKey && e.key === 'z') { e.preventDefault(); toggleZenMode(); }
    }
});

// UI Utilities
function toggleTheme() {
    document.documentElement.classList.toggle('dark-mode');
    localStorage.setItem('pp3-theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light');
    closeCmdk();
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

// Boot
init();
</script>
</body>
</html>
