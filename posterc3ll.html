<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosterC3ll - Local-First Spreadsheet</title>
    <style>
        /* --- Theme Definitions --- */
        :root {
            --pc-bg: #F8F9FA; --pc-surface: #FFFFFF; --pc-primary: #10B981;
            --pc-primary-dark: #047857; --pc-border: #D1D5DB; --pc-border-light: #E5E7EB;
            --pc-grid-line: #E5E7EB; --pc-text: #1A1D21; --pc-text-muted: #6B7280; 
            --pc-highlight: #ECFDF5; --pc-ribbon-bg: #F3F4F6;
            --pc-fill-handle: #10B981;
        }
        body[data-theme="dark"] {
            --pc-bg: #111827; --pc-surface: #1F2937; --pc-primary: #10B981;
            --pc-primary-dark: #34D399; --pc-border: #374151; --pc-border-light: #4B5563;
            --pc-grid-line: #374151; --pc-text: #F9FAFB; --pc-text-muted: #9CA3AF; 
            --pc-highlight: #064E3B; --pc-ribbon-bg: #111827;
            --pc-fill-handle: #34D399;
        }
        body[data-theme="midnight"] {
            --pc-bg: #0f172a; --pc-surface: #1e293b; --pc-primary: #10b981;
            --pc-primary-dark: #34d399; --pc-border: #334155; --pc-border-light: #475569;
            --pc-grid-line: #334155; --pc-text: #e2e8f0; --pc-text-muted: #94a3b8; 
            --pc-highlight: #064e3b; --pc-ribbon-bg: #172033;
            --pc-fill-handle: #10b981;
        }
        body[data-theme="forest"] {
            --pc-bg: #052e2b; --pc-surface: #0c3b35; --pc-primary: #34d399;
            --pc-primary-dark: #6ee7b7; --pc-border: #0f513b; --pc-border-light: #155e44;
            --pc-grid-line: #155e44; --pc-text: #d1fae5; --pc-text-muted: #9ca3af; 
            --pc-highlight: #08403a; --pc-ribbon-bg: #073631;
            --pc-fill-handle: #34d399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--pc-bg); color: var(--pc-text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- Navbar --- */
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 0.4rem 1rem; background-color: var(--pc-surface); border-bottom: 1px solid var(--pc-border-light); z-index: 10; }
        .nav-left { display: flex; align-items: center; gap: 1rem; }
        .logo { width: 32px; height: 32px; }
        .brand-name { font-size: 1.2rem; font-weight: 700; color: var(--pc-primary-dark); }
        .nav-actions { display: flex; gap: 0.5rem; align-items: center; }
        
        /* --- Buttons & Ribbon --- */
        .btn { background-color: var(--pc-surface); color: var(--pc-text); border: 1px solid var(--pc-border); padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.15s ease; display: flex; align-items: center; gap: 0.4rem; }
        .btn:hover { background-color: var(--pc-highlight); border-color: var(--pc-primary); color: var(--pc-primary-dark); }
        .btn-primary { background-color: var(--pc-primary); color: white; border: none; }
        .btn-primary:hover { background-color: var(--pc-primary-dark); color: white; }
        .btn-ribbon { padding: 0.3rem 0.5rem; font-size: 0.8rem; border: none; background: transparent; border-radius: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--pc-text); cursor: pointer; }
        .btn-ribbon:hover { background-color: var(--pc-highlight); border: 1px solid var(--pc-border-light); padding: calc(0.3rem - 1px) calc(0.5rem - 1px); }
        .btn-ribbon.active { background-color: var(--pc-highlight); border: 1px solid var(--pc-primary); padding: calc(0.3rem - 1px) calc(0.5rem - 1px); }

        .ribbon { display: flex; align-items: stretch; padding: 0.2rem 1rem; background-color: var(--pc-ribbon-bg); border-bottom: 1px solid var(--pc-border); overflow-x: auto; }
        .ribbon-group { display: flex; flex-direction: column; padding: 0.2rem 0.5rem; border-right: 1px solid var(--pc-border-light); }
        .ribbon-group-content { display: flex; gap: 0.2rem; align-items: center; flex: 1; }
        .ribbon-group-label { text-align: center; font-size: 0.65rem; color: var(--pc-text-muted); margin-top: 0.2rem; }

        /* --- Toolbar --- */
        .toolbar { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1rem; background-color: var(--pc-surface); border-bottom: 1px solid var(--pc-border); }
        .name-box { border: 1px solid var(--pc-border); padding: 0.35rem; border-radius: 4px; width: 80px; text-align: center; font-weight: bold; font-size: 0.8rem; color: var(--pc-primary-dark); background-color: var(--pc-highlight); }
        .fx-label { font-style: italic; font-weight: bold; color: var(--pc-text-muted); font-family: serif; }
        .formula-bar { flex: 1; border: 1px solid var(--pc-border); padding: 0.35rem; border-radius: 4px; font-family: monospace; font-size: 0.9rem; background: var(--pc-surface); color: var(--pc-text); }
        .formula-bar:focus { outline: none; border-color: var(--pc-primary); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
        
        /* --- Grid Engine (HTML Table) --- */
        .grid-wrapper { flex: 1; overflow: auto; position: relative; background-color: var(--pc-surface); }
        .grid-wrapper::-webkit-scrollbar { width: 12px; height: 12px; }
        .grid-wrapper::-webkit-scrollbar-track { background: var(--pc-ribbon-bg); }
        .grid-wrapper::-webkit-scrollbar-thumb { background: var(--pc-border); border: 3px solid var(--pc-ribbon-bg); border-radius: 6px; }
        
        table { border-collapse: collapse; width: max-content; table-layout: fixed; }
        thead th { position: sticky; top: 0; z-index: 3; }
        tbody th { position: sticky; left: 0; z-index: 3; }
        thead th:first-child { z-index: 5; left: 0; }
        
        th, td { border: 1px solid var(--pc-grid-line); padding: 0; margin: 0; background: var(--pc-surface); }
        
        .gh-col, .gh-row, .gh-corner {
            background-color: var(--pc-ribbon-bg); color: var(--pc-text-muted);
            font-weight: 500; font-size: 0.75rem; text-align: center; user-select: none;
            min-width: 40px; height: 22px; cursor: pointer;
        }
        .gh-col { min-width: 100px; width: 100px; position: relative; }
        .gh-col:hover, .gh-row:hover { background-color: var(--pc-border); }
        .gh-col.active, .gh-row.active { background-color: var(--pc-primary) !important; color: white; }
        
        td.cell { height: 24px; overflow: hidden; padding: 0 4px; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: clip; color: var(--pc-text); }
        .cell-content { width: 100%; height: 24px; line-height: 24px; overflow: hidden; }
        
        /* Excel-like Selection Box */
        .selected-range { background-color: rgba(16, 185, 129, 0.1) !important; }
        .selection-box { position: absolute; border: 2px solid var(--pc-primary); background: transparent; pointer-events: none; z-index: 4; box-sizing: border-box; }
        .active-cell { outline: 2px solid var(--pc-primary); outline-offset: -2px; z-index: 6; background: var(--pc-surface) !important; }
        
        .col-resizer { width: 4px; height: 100%; position: absolute; right: -2px; top: 0; cursor: col-resize; z-index: 4; }
        .col-resizer:hover, .col-resizer.active { background-color: var(--pc-primary); }
        
        .hidden-input { position: absolute; border: none; outline: 2px solid var(--pc-primary); padding: 0 4px; font-size: 0.8rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: none; z-index: 10; background: var(--pc-surface); color: var(--pc-text); box-sizing: border-box; line-height: 24px; }
        #fillHandle { position: absolute; width: 7px; height: 7px; background: var(--pc-fill-handle); border: 1px solid var(--pc-surface); cursor: crosshair; z-index: 20; display: none; }

        /* --- Select & Inputs --- */
        select { background-color: var(--pc-surface); color: var(--pc-text); border: 1px solid var(--pc-border); padding: 0.3rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        input[type="color"] { background: transparent; border: 1px solid var(--pc-border); border-radius: 4px; width: 30px; height: 30px; cursor: pointer; padding: 2px; }
        
        /* --- Modals & Menus --- */
        .context-menu { position: fixed; background: var(--pc-surface); border: 1px solid var(--pc-border); border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 100; min-width: 180px; display: none; }
        .context-menu button { display: block; width: 100%; text-align: left; padding: 0.5rem 1rem; border: none; background: transparent; font-size: 0.85rem; cursor: pointer; color: var(--pc-text); }
        .context-menu button:hover { background-color: var(--pc-highlight); color: var(--pc-primary-dark); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal { background: var(--pc-surface); padding: 1.5rem; border-radius: 8px; width: 300px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); color: var(--pc-text); }
        .modal h3 { margin-bottom: 1rem; color: var(--pc-primary-dark); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }
        .modal label { display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0; font-size: 0.9rem; cursor: pointer; }

        /* --- Command Palette --- */
        .palette-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: flex-start; padding-top: 15vh; z-index: 300; }
        .palette-box { background: var(--pc-surface); width: 500px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; }
        .palette-input { width: 100%; padding: 1rem; border: none; border-bottom: 1px solid var(--pc-border-light); font-size: 1.1rem; outline: none; background: var(--pc-surface); color: var(--pc-text); }
        .palette-results { max-height: 300px; overflow-y: auto; }
        .palette-item { padding: 0.8rem 1rem; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid var(--pc-border-light); color: var(--pc-text); }
        .palette-item:hover, .palette-item.active { background-color: var(--pc-highlight); color: var(--pc-primary-dark); }

        .p2p-status { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: #fee2e2; color: #ef4444; font-weight: 600; }
        .p2p-status.live { background: var(--pc-highlight); color: var(--pc-primary-dark); }
        .sheet-tabs { display: flex; align-items: center; gap: 0.2rem; padding: 0.2rem 1rem; background-color: var(--pc-ribbon-bg); border-top: 1px solid var(--pc-border); }
        .tab { padding: 0.3rem 0.8rem; font-size: 0.8rem; border: 1px solid transparent; border-radius: 4px 4px 0 0; cursor: pointer; color: var(--pc-text-muted); }
        .tab.active { background-color: var(--pc-surface); border: 1px solid var(--pc-border); border-bottom: none; color: var(--pc-primary-dark); font-weight: 600; }

        /* Markdown & Rich Cells */
        .md-h1 { font-size: 1.1rem; font-weight: bold; } .md-h2 { font-size: 0.9rem; font-weight: bold; }
        .md-ul { list-style: disc; margin-left: 15px; } .md-strong { font-weight: bold; } .md-em { font-style: italic; }
        .progress-bar-track { width: 90%; height: 8px; background: var(--pc-border-light); border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { height: 100%; background: var(--pc-primary); border-radius: 4px; }
        .cell-image { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body data-theme="light">

    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <linearGradient id="cbgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#F0FDF4"/><stop offset="1" stop-color="#DCFCE7"/></linearGradient>
            <radialGradient id="cpinGrad" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#10B981"/></radialGradient>
            <filter id="cshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1A1D21" flood-opacity="0.2"/></filter>
        </defs>
    </svg>

    <nav class="navbar">
        <div class="nav-left">
            <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="url(#cbgGrad)"/><rect x="1.5" y="1.5" width="117" height="117" rx="26.5" fill="none" stroke="#1A1D21" stroke-opacity="0.05"/><path d="M38 42 L60 24" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/><path d="M82 42 L60 24" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/><circle cx="38" cy="42" r="2.5" fill="#10B981"/><circle cx="82" cy="42" r="2.5" fill="#10B981"/><rect x="32" y="38" width="56" height="64" rx="10" fill="#FFFFFF" filter="url(#cshadow)"/><circle cx="60" cy="62" r="16" fill="#ECFDF5"/><g fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="51" y="53" width="18" height="18" rx="2"/><line x1="51" y1="59" x2="69" y2="59"/><line x1="51" y1="65" x2="69" y2="65"/><line x1="57" y1="53" x2="57" y2="71"/><line x1="63" y1="53" x2="63" y2="71"/></g><rect x="57" y="59" width="6" height="6" fill="#047857" stroke="none"/><rect x="42" y="86" width="36" height="5" rx="2.5" fill="#1A1D21"/><rect x="48" y="94" width="24" height="5" rx="2.5" fill="#10B981"/><circle cx="60" cy="20" r="7" fill="url(#cpinGrad)" filter="url(#cshadow)"/><circle cx="57.5" cy="17.5" r="1.8" fill="#FFFFFF" opacity="0.7"/></svg>
            <span class="brand-name">PosterC3ll</span>
            <div class="p2p-status" id="p2pStatus">Offline</div>
        </div>
        <div class="nav-actions">
            <select id="themeSelect" title="Change Theme">
                <option value="light">Light (Emerald)</option>
                <option value="dark">Dark (Obsidian)</option>
                <option value="midnight">Midnight</option>
                <option value="forest">Forest</option>
            </select>
            <button class="btn" id="btnShareLive" title="Share Sheet P2P"><i data-lucide="share-2"></i> Share Live</button>
            <button class="btn" id="btnOpen">Open</button>
            <button class="btn btn-primary" id="btnSaveDirect" title="Save directly to hard drive (Ctrl+S)"><i data-lucide="save"></i> Save Direct</button>
            <input type="file" id="fileInput" accept=".json,.pcl" style="display:none">
        </div>
    </nav>

    <div class="ribbon">
        <div class="ribbon-group">
            <div class="ribbon-group-content">
                <button class="btn-ribbon" id="btn-bold"><i data-lucide="bold"></i><span>Bold</span></button>
                <button class="btn-ribbon" id="btn-italic"><i data-lucide="italic"></i><span>Italic</span></button>
                <input type="color" id="bgColor" value="#FFFFFF" title="Fill Color">
            </div>
            <div class="ribbon-group-label">Font</div>
        </div>
        
        <div class="ribbon-group">
            <div class="ribbon-group-content">
                <button class="btn-ribbon" id="btn-currency"><i data-lucide="dollar-sign"></i><span>Currency</span></button>
                <button class="btn-ribbon" id="btn-percent"><i data-lucide="percent"></i><span>Percent</span></button>
            </div>
            <div class="ribbon-group-label">Number</div>
        </div>

        <div class="ribbon-group">
            <div class="ribbon-group-content">
                <button class="btn-ribbon" id="btn-markdown"><i data-lucide="file-text"></i><span>Markdown</span></button>
                <button class="btn-ribbon" id="btn-progress"><i data-lucide="bar-chart-2"></i><span>Progress</span></button>
                <button class="btn-ribbon" id="btn-image"><i data-lucide="image"></i><span>Image</span></button>
            </div>
            <div class="ribbon-group-label">Poster Types</div>
        </div>

        <div class="ribbon-group">
            <div class="ribbon-group-content">
                <button class="btn-ribbon" id="btn-freeze"><i data-lucide="pin"></i><span>Freeze Panes</span></button>
                <button class="btn-ribbon" id="btn-insert"><i data-lucide="insert"></i><span>Insert</span></button>
                <button class="btn-ribbon" id="btn-cmd" title="Open Command Palette (Ctrl+K)"><i data-lucide="command"></i><span>Commands</span></button>
            </div>
            <div class="ribbon-group-label">View & Tools</div>
        </div>
    </div>

    <div class="toolbar">
        <div class="name-box" id="activeCellDisplay">A1</div>
        <span class="fx-label">fx</span>
        <input type="text" class="formula-bar" id="formulaBar" placeholder="Enter value or try =FETCH('https://api.github.com/zen')">
    </div>

    <div class="grid-wrapper" id="gridWrapper">
        <table id="spreadsheet">
            <thead id="gridHead"></thead>
            <tbody id="gridBody"></tbody>
        </table>
        <input type="text" class="hidden-input" id="cellEditor">
        <div class="selection-box" id="selectionBox"></div>
        <div id="fillHandle"></div>
    </div>

    <div class="sheet-tabs">
        <div class="tab active">Sheet1</div>
    </div>

    <div class="palette-overlay" id="paletteOverlay">
        <div class="palette-box">
            <input type="text" class="palette-input" id="paletteInput" placeholder="Type a command... (e.g., Bold, Currency, Theme)" autofocus>
            <div class="palette-results" id="paletteResults"></div>
        </div>
    </div>

    <div class="context-menu" id="contextMenu">
        <button id="ctx-insert-cells">Insert Cells...</button>
        <button id="ctx-delete-cells">Delete Cells...</button>
        <hr>
        <button id="ctx-clear-content">Clear Contents</button>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Insert</h3>
            <label><input type="radio" name="dir" value="row" checked> Entire Row</label>
            <label><input type="radio" name="dir" value="col"> Entire Column</label>
            <div class="modal-actions">
                <button class="btn" id="modalCancel">Cancel</button>
                <button class="btn btn-primary" id="modalConfirm">OK</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        const ROWS = 100, COLS = 26;
        let sheetData = {};
        try {
            sheetData = JSON.parse(localStorage.getItem('posterC3llData') || '{}');
            if (!sheetData.settings) sheetData.settings = {};
            if (typeof sheetData !== 'object' || sheetData === null) sheetData = {};
        } catch (e) {
            console.error("Corrupted local data, resetting.", e);
            sheetData = { settings: {} };
        }
        
        let activeCell = { row: 0, col: 0 };
        let selectedRange = { startRow: 0, startCol: 0, endRow: 0, endCol: 0 };
        let isSelecting = false, isFilling = false, currentModalAction = null;
        let fileHandle = null, peer = null, conn = null, isApplyingRemoteData = false;
        let isFormulaBarFocused = false;

        const gridHead = document.getElementById('gridHead');
        const gridBody = document.getElementById('gridBody');
        const gridWrapper = document.getElementById('gridWrapper');
        const cellEditor = document.getElementById('cellEditor');
        const formulaBar = document.getElementById('formulaBar');
        const fillHandle = document.getElementById('fillHandle');
        const selectionBox = document.getElementById('selectionBox');

        const commands = [
            { title: "Format: Bold", action: () => applyStyle('b', true) },
            { title: "Format: Markdown", action: () => applyStyle('fmt', 'markdown') },
            { title: "Format: Progress Bar", action: () => applyStyle('fmt', 'progress') },
            { title: "Format: Currency", action: () => applyStyle('fmt', 'currency') },
            { title: "Format: Percent", action: () => applyStyle('fmt', 'percent') },
            { title: "Toggle Freeze Panes", action: toggleFreezePanes },
            { title: "Theme: Light", action: () => changeTheme('light') },
            { title: "Theme: Dark", action: () => changeTheme('dark') },
            { title: "Theme: Midnight", action: () => changeTheme('midnight') },
            { title: "Theme: Forest", action: () => changeTheme('forest') },
            { title: "Insert Row", action: () => openModal('insert', 'row') },
            { title: "Insert Column", action: () => openModal('insert', 'col') },
            { title: "Clear Contents", action: clearContents },
            { title: "Save Direct to Device", action: saveDirect, shortcut: "Ctrl+S" },
            { title: "Share Live (P2P)", action: startP2PSharing }
        ];

        // --- Theme Logic ---
        function changeTheme(themeName) {
            document.body.setAttribute('data-theme', themeName);
            document.getElementById('themeSelect').value = themeName;
            sheetData.settings.theme = themeName;
            saveLocally();
        }
        document.getElementById('themeSelect').onchange = (e) => changeTheme(e.target.value);
        if (sheetData.settings.theme) changeTheme(sheetData.settings.theme);

        // --- Grid Generation ---
        function createGrid() {
            // Headers
            let headHtml = '<tr><th class="gh-corner"></th>';
            for (let c = 0; c < COLS; c++) {
                const width = sheetData._colWidths?.[c] || 100;
                headHtml += `<th class="gh-col" data-col="${c}" style="min-width:${width}px; width:${width}px;">${String.fromCharCode(65 + c)}<div class="col-resizer" data-col="${c}"></div></th>`;
            }
            headHtml += '</tr>';
            gridHead.innerHTML = headHtml;

            // Body
            let bodyHtml = '';
            for (let r = 0; r < ROWS; r++) {
                bodyHtml += `<tr><th class="gh-row" data-row="${r}">${r + 1}</th>`;
                for (let c = 0; c < COLS; c++) {
                    const cellId = `${String.fromCharCode(65 + c)}${r + 1}`;
                    const cellData = sheetData[cellId] || {};
                    const styleStr = getCellStyleString(cellData.s || {});
                    const displayHtml = getCellDisplayHtml(cellId, cellData);
                    bodyHtml += `<td class="cell" data-row="${r}" data-col="${c}" data-id="${cellId}" style="${styleStr}"><div class="cell-content">${displayHtml}</div></td>`;
                }
                bodyHtml += '</tr>';
            }
            gridBody.innerHTML = bodyHtml;

            attachGridListeners();
            updateActiveCellUI();
        }

        function getCellStyleString(s) {
            let str = '';
            if (s.b) str += 'font-weight:bold; ';
            if (s.bg) str += `background-color:${s.bg}; `;
            if (s.a) str += `text-align:${s.a}; `;
            return str;
        }

        function getCellDisplayHtml(id, data) {
            if (!data.v) return '';
            let val = data.v;
            if (typeof val === 'string' && val.startsWith('=')) {
                if (val.toUpperCase().startsWith('=FETCH(')) { handleFetchFormula(id, val); return '<i style="color:var(--pc-text-muted)">Loading...</i>'; }
                try { val = evaluateFormula(val.substring(1)); if (isNaN(val) && typeof val === 'number') return ''; } catch (e) { return '#ERROR!'; }
            }
            if (data.s && data.s.fmt === 'currency' && !isNaN(val)) return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
            if (data.s && data.s.fmt === 'percent' && !isNaN(val)) return `${(parseFloat(val) * 100).toFixed(0)}%`;
            if (data.s && data.s.fmt === 'markdown') return parseMarkdown(val);
            if (data.s && data.s.fmt === 'progress') return `<div class="progress-bar-track"><div class="progress-bar-fill" style="width:${Math.max(0, Math.min(1, parseFloat(val) || 0))*100}%"></div></div>`;
            if (data.s && data.s.fmt === 'image') return `<img src="${val}" class="cell-image" alt="img">`;
            return val;
        }

        function parseMarkdown(text) {
            return text.replace(/^# (.*$)/gm, '<div class="md-h1">$1</div>')
                .replace(/^## (.*$)/gm, '<div class="md-h2">$1</div>')
                .replace(/^\* (.*$)/gm, '<ul class="md-ul"><li>$1</li></ul>')
                .replace(/\*\*(.*?)\*/g, '<span class="md-strong">$1</span>')
                .replace(/\*(.*?)\*/g, '<span class="md-em">$1</span>');
        }

        function evaluateFormula(formula) {
            formula = formula.replace(/SUM\(([^)]+)\)/gi, (match, rangeStr) => {
                const [start, end] = rangeStr.split(':'); return sumRange(start, end);
            });
            formula = formula.replace(/([A-Z]+)([0-9]+)/g, (match, col, row) => {
                const cellData = sheetData[`${col}${row}`];
                if (!cellData || !cellData.v) return '0';
                let val = cellData.v;
                if (typeof val === 'string' && val.startsWith('=')) val = evaluateFormula(val.substring(1));
                return parseFloat(val) || 0;
            });
            if (!/^[0-9+\-*/().\s]+$/.test(formula)) throw new Error("Invalid");
            return Function('"use strict";return (' + formula + ')')();
        }

        function sumRange(start, end) {
            const sM = start.match(/([A-Z]+)([0-9]+)/), eM = end.match(/([A-Z]+)([0-9]+)/);
            if (!sM || !eM) return 0;
            let sum = 0;
            for (let r = +sM[2] - 1; r <= +eM[2] - 1; r++) for (let c = sM[1].charCodeAt(0) - 65; c <= eM[1].charCodeAt(0) - 65; c++) {
                const val = sheetData[`${String.fromCharCode(65 + c)}${r + 1}`]?.v;
                if (val && !isNaN(val)) sum += parseFloat(val);
            }
            return sum;
        }

        async function handleFetchFormula(id, formula) {
            try {
                const url = formula.match(/=FETCH\(["']([^"']+)["']\)/i)[1];
                const res = await fetch(url); const text = await res.text();
                let val; try { const json = JSON.parse(text); val = JSON.stringify(json[Object.keys(json)[0]] || json); } catch { val = text.substring(0, 100); }
                if (!sheetData[id]) sheetData[id] = { s: {} };
                sheetData[id].v = val; saveLocally(); recalculateAndRender();
            } catch (e) { if (sheetData[id]) sheetData[id].v = "#FETCH_ERROR"; recalculateAndRender(); }
        }

        // --- UI & Interactions ---
        function attachGridListeners() {
            document.querySelectorAll('.cell').forEach(td => {
                td.addEventListener('mousedown', (e) => {
                    if (e.button === 2) return;
                    if (isFormulaBarFocused) { formulaBar.value += td.dataset.id; formulaBar.focus(); return; }
                    isSelecting = true;
                    activeCell = { row: parseInt(td.dataset.row), col: parseInt(td.dataset.col) };
                    selectedRange = { ...activeCell, endRow: activeCell.row, endCol: activeCell.col };
                    updateSelectionUI(); updateActiveCellUI();
                    formulaBar.value = sheetData[td.dataset.id]?.v || '';
                });
                td.addEventListener('mouseenter', () => {
                    if (isFilling) { selectedRange.endRow = parseInt(td.dataset.row); selectedRange.endCol = parseInt(td.dataset.col); updateSelectionUI(); }
                    else if (isSelecting) { selectedRange.endRow = parseInt(td.dataset.row); selectedRange.endCol = parseInt(td.dataset.col); updateSelectionUI(); }
                });
                td.addEventListener('dblclick', () => startEditing(td));
                td.addEventListener('contextmenu', (e) => {
                    e.preventDefault(); activeCell = { row: parseInt(td.dataset.row), col: parseInt(td.dataset.col) };
                    updateActiveCellUI(); showContextMenu(e.clientX, e.clientY);
                });
            });

            document.querySelectorAll('.gh-col').forEach(th => {
                th.addEventListener('click', (e) => {
                    if (e.target.classList.contains('col-resizer')) return;
                    const c = parseInt(th.dataset.col);
                    activeCell = { row: 0, col: c };
                    selectedRange = { startRow: 0, startCol: c, endRow: ROWS - 1, endCol: c };
                    updateSelectionUI(); updateActiveCellUI();
                });
            });
            
            document.querySelectorAll('.gh-row').forEach(th => {
                th.addEventListener('click', (e) => {
                    const r = parseInt(th.dataset.row);
                    activeCell = { row: r, col: 0 };
                    selectedRange = { startRow: r, startCol: 0, endRow: r, endCol: COLS - 1 };
                    updateSelectionUI(); updateActiveCellUI();
                });
            });

            document.querySelectorAll('.col-resizer').forEach(h => h.addEventListener('mousedown', startColResize));
            document.addEventListener('mouseup', handleMouseUp);
            document.addEventListener('click', (e) => { if (!e.target.closest('#contextMenu') && !e.target.closest('.cell')) document.getElementById('contextMenu').style.display = 'none'; });
        }

        function startEditing(td) {
            const rect = td.getBoundingClientRect();
            const gridRect = gridWrapper.getBoundingClientRect();
            cellEditor.style.display = 'block';
            cellEditor.style.left = `${rect.left - gridRect.left + gridWrapper.scrollLeft}px`;
            cellEditor.style.top = `${rect.top - gridRect.top + gridWrapper.scrollTop}px`;
            cellEditor.style.width = `${rect.width}px`; cellEditor.style.height = `${rect.height}px`;
            const cellId = td.dataset.id;
            cellEditor.value = sheetData[cellId]?.v || '';
            cellEditor.focus(); cellEditor.select();
            cellEditor.onblur = () => saveCellEdit(td);
            cellEditor.onkeydown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); saveCellEdit(td); moveActiveCell(1, 0); }
                else if (e.key === 'Tab') { e.preventDefault(); saveCellEdit(td); moveActiveCell(0, 1); }
                else if (e.key === 'Escape') { cellEditor.style.display = 'none'; }
            };
        }

        function saveCellEdit(td) {
            if (cellEditor.style.display === 'none') return;
            const cellId = td.dataset.id;
            if (!sheetData[cellId]) sheetData[cellId] = { s: {} };
            sheetData[cellId].v = cellEditor.value;
            cellEditor.style.display = 'none';
            saveLocally(); recalculateAndRender();
        }

        function moveActiveCell(rOffset, cOffset) {
            activeCell.row = Math.min(ROWS - 1, Math.max(0, activeCell.row + rOffset));
            activeCell.col = Math.min(COLS - 1, Math.max(0, activeCell.col + cOffset));
            selectedRange = { ...activeCell, endRow: activeCell.row, endCol: activeCell.col };
            updateSelectionUI(); updateActiveCellUI();
            formulaBar.value = sheetData[`${String.fromCharCode(65 + activeCell.col)}${activeCell.row + 1}`]?.v || '';
        }

        function updateSelectionUI() {
            document.querySelectorAll('.selected-range').forEach(el => el.classList.remove('selected-range'));
            const minR = Math.min(selectedRange.startRow, selectedRange.endRow);
            const maxR = Math.max(selectedRange.startRow, selectedRange.endRow);
            const minC = Math.min(selectedRange.startCol, selectedRange.endCol);
            const maxC = Math.max(selectedRange.startCol, selectedRange.endCol);
            
            for (let r = minR; r <= maxR; r++) {
                for (let c = minC; c <= maxC; c++) {
                    document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`)?.classList.add('selected-range');
                }
            }
            
            const startTd = document.querySelector(`.cell[data-row="${minR}"][data-col="${minC}"]`);
            const endTd = document.querySelector(`.cell[data-row="${maxR}"][data-col="${maxC}"]`);
            if (startTd && endTd) {
                const gridRect = gridWrapper.getBoundingClientRect();
                const sRect = startTd.getBoundingClientRect();
                const eRect = endTd.getBoundingClientRect();
                
                selectionBox.style.display = 'block';
                selectionBox.style.left = `${sRect.left - gridRect.left + gridWrapper.scrollLeft}px`;
                selectionBox.style.top = `${sRect.top - gridRect.top + gridWrapper.scrollTop}px`;
                selectionBox.style.width = `${eRect.right - sRect.left}px`;
                selectionBox.style.height = `${eRect.bottom - sRect.top}px`;
            }
            positionFillHandle();
        }

        function updateActiveCellUI() {
            document.querySelectorAll('.active-cell, .active').forEach(el => el.classList.remove('active-cell', 'active'));
            const cellId = `${String.fromCharCode(65 + activeCell.col)}${activeCell.row + 1}`;
            document.getElementById('activeCellDisplay').textContent = cellId;
            const activeTd = document.querySelector(`.cell[data-row="${activeCell.row}"][data-col="${activeCell.col}"]`);
            if (activeTd) {
                activeTd.classList.add('active-cell');
                document.querySelector(`.gh-row[data-row="${activeCell.row}"]`)?.classList.add('active');
                document.querySelector(`.gh-col[data-col="${activeCell.col}"]`)?.classList.add('active');
            }
        }

        function positionFillHandle() {
            const minR = Math.min(selectedRange.startRow, selectedRange.endRow);
            const maxR = Math.max(selectedRange.startRow, selectedRange.endRow);
            const minC = Math.min(selectedRange.startCol, selectedRange.endCol);
            const maxC = Math.max(selectedRange.startCol, selectedRange.endCol);
            const td = document.querySelector(`.cell[data-row="${maxR}"][data-col="${maxC}"]`);
            if (td) {
                const rect = td.getBoundingClientRect();
                const gridRect = gridWrapper.getBoundingClientRect();
                fillHandle.style.display = 'block';
                fillHandle.style.left = `${rect.right - gridRect.left - 4}px`;
                fillHandle.style.top = `${rect.bottom - gridRect.top - 4}px`;
            } else { fillHandle.style.display = 'none'; }
        }

        function recalculateAndRender() {
            document.querySelectorAll('.cell').forEach(td => {
                const id = td.dataset.id; const data = sheetData[id] || {};
                const contentDiv = td.querySelector('.cell-content');
                if (!contentDiv) return;
                td.style.cssText = td.style.cssText.split('; ').filter(s => !s.startsWith('font-weight') && !s.startsWith('background-color') && !s.startsWith('text-align')).join('; ');
                const styleStr = getCellStyleString(data.s || {});
                td.style.cssText += styleStr;
                contentDiv.innerHTML = getCellDisplayHtml(id, data);
            });
        }

        // --- Fill Handle ---
        fillHandle.addEventListener('mousedown', (e) => { e.stopPropagation(); e.preventDefault(); isFilling = true; });

        function handleMouseUp() {
            if (isFilling) { executeFill(); isFilling = false; }
            isSelecting = false;
        }

        function executeFill() {
            const minR = Math.min(selectedRange.startRow, selectedRange.endRow);
            const maxR = Math.max(selectedRange.startRow, selectedRange.endRow);
            const minC = Math.min(selectedRange.startCol, selectedRange.endCol);
            const maxC = Math.max(selectedRange.startCol, selectedRange.endCol);

            const isFillingDown = activeCell.row === minR;

            function copyCell(srcId, destId, rOffset, cOffset) {
                if (!sheetData[srcId]) return;
                const srcData = JSON.parse(JSON.stringify(sheetData[srcId]));
                if (typeof srcData.v === 'string' && srcData.v.startsWith('=')) {
                    srcData.v = srcData.v.replace(/([A-Z]+)([0-9]+)/g, (match, col, row) => {
                        let newCol = String.fromCharCode(col.charCodeAt(0) + cOffset);
                        let newRow = parseInt(row) + rOffset;
                        return `${newCol}${newRow}`;
                    });
                } else if (!isNaN(srcData.v)) {
                    srcData.v = parseFloat(srcData.v) + (rOffset + cOffset > 0 ? 1 : -1); 
                }
                sheetData[destId] = srcData;
            }

            if (isFillingDown) {
                for (let c = minC; c <= maxC; c++) {
                    let lastVal = sheetData[`${String.fromCharCode(65 + c)}${minR + 1}`]?.v || 0;
                    for (let r = maxR + 1; r <= selectedRange.endRow; r++) {
                        const destId = `${String.fromCharCode(65 + c)}${r + 1}`;
                        const srcId = `${String.fromCharCode(65 + c)}${minR + 1}`;
                        copyCell(srcId, destId, r - minR, 0);
                        if (!isNaN(lastVal)) lastVal = parseFloat(lastVal) + 1;
                    }
                }
            }
            saveLocally(); recalculateAndRender();
        }

        // --- Ribbon Actions ---
        function applyStyle(styleKey, value) {
            const minR = Math.min(selectedRange.startRow, selectedRange.endRow);
            const maxR = Math.max(selectedRange.startRow, selectedRange.endRow);
            const minC = Math.min(selectedRange.startCol, selectedRange.endCol);
            const maxC = Math.max(selectedRange.startCol, selectedRange.endCol);
            for (let r = minR; r <= maxR; r++) for (let c = minC; c <= maxC; c++) {
                const id = `${String.fromCharCode(65 + c)}${r + 1}`;
                if (!sheetData[id]) sheetData[id] = { v: '', s: {} };
                if (!sheetData[id].s) sheetData[id].s = {};
                sheetData[id].s[styleKey] = value;
            }
            saveLocally(); recalculateAndRender();
        }

        document.getElementById('btn-bold').onclick = () => applyStyle('b', true);
        document.getElementById('btn-currency').onclick = () => applyStyle('fmt', 'currency');
        document.getElementById('btn-percent').onclick = () => applyStyle('fmt', 'percent');
        document.getElementById('btn-markdown').onclick = () => applyStyle('fmt', 'markdown');
        document.getElementById('btn-progress').onclick = () => applyStyle('fmt', 'progress');
        document.getElementById('btn-image').onclick = () => applyStyle('fmt', 'image');
        document.getElementById('bgColor').oninput = (e) => applyStyle('bg', e.target.value);

        function clearContents() {
            const minR = Math.min(selectedRange.startRow, selectedRange.endRow);
            const maxR = Math.max(selectedRange.startRow, selectedRange.endRow);
            const minC = Math.min(selectedRange.startCol, selectedRange.endCol);
            const maxC = Math.max(selectedRange.startCol, selectedRange.endCol);
            for (let r = minR; r <= maxR; r++) for (let c = minC; c <= maxC; c++) {
                const id = `${String.fromCharCode(65 + c)}${r + 1}`; if(sheetData[id]) delete sheetData[id].v;
            }
            recalculateAndRender(); saveLocally(); document.getElementById('contextMenu').style.display = 'none';
        }
        document.getElementById('ctx-clear-content').onclick = clearContents;

        // --- Freeze Panes ---
        function toggleFreezePanes() {
            sheetData.settings = sheetData.settings || {};
            sheetData.settings.freeze = !sheetData.settings.freeze;
            saveLocally(); applyFreezePanels();
        }
        document.getElementById('btn-freeze').onclick = toggleFreezePanes;

        function applyFreezePanels() {
            // CSS handles sticky headers automatically now, so this is mostly a placeholder for future complex freezing
        }

        // --- Command Palette ---
        const paletteOverlay = document.getElementById('paletteOverlay');
        const paletteInput = document.getElementById('paletteInput');
        const paletteResults = document.getElementById('paletteResults');
        let activeIdx = 0;
        function openPalette() { paletteOverlay.style.display = 'flex'; paletteInput.value = ''; renderPalette(''); paletteInput.focus(); }
        function closePalette() { paletteOverlay.style.display = 'none'; }
        paletteInput.addEventListener('input', () => renderPalette(paletteInput.value));
        paletteInput.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(commands.length-1, activeIdx+1); renderPalette(paletteInput.value); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(0, activeIdx-1); renderPalette(paletteInput.value); }
            else if (e.key === 'Enter') { e.preventDefault(); executePalette(paletteInput.value); }
            else if (e.key === 'Escape') closePalette();
        });
        function renderPalette(query) {
            const filtered = commands.filter(c => c.title.toLowerCase().includes(query.toLowerCase()));
            paletteResults.innerHTML = filtered.map((c, i) => `<div class="palette-item ${i === activeIdx ? 'active' : ''}" data-title="${c.title}"><div>${c.title}</div>${c.shortcut ? `<span>${c.shortcut}</span>` : ''}</div>`).join('');
            paletteResults.querySelectorAll('.palette-item').forEach(el => el.onclick = () => executePalette(el.dataset.title));
        }
        function executePalette(title) { const cmd = commands.find(c => c.title.toLowerCase() === title.toLowerCase()); if (cmd) { cmd.action(); closePalette(); } }

        // --- Context & Modals ---
        function showContextMenu(x, y) { const m = document.getElementById('contextMenu'); m.style.display = 'block'; m.style.left = `${x}px`; m.style.top = `${y}px`; }
        document.getElementById('btn-insert').onclick = () => openModal('insert', null);
        document.getElementById('ctx-insert-cells').onclick = () => openModal('insert', null);
        function openModal(action, presetDir) {
            currentModalAction = action;
            document.getElementById('modalTitle').textContent = action === 'insert' ? 'Insert' : 'Delete';
            if (presetDir) document.querySelector(`input[name="dir"][value="${presetDir}"]`).checked = true;
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('contextMenu').style.display = 'none';
        }
        document.getElementById('modalCancel').onclick = () => document.getElementById('modalOverlay').style.display = 'none';
        document.getElementById('modalConfirm').onclick = () => {
            const dir = document.querySelector('input[name="dir"]:checked').value;
            if (currentModalAction === 'insert') insertRowOrCol(dir);
            document.getElementById('modalOverlay').style.display = 'none';
        };
        function insertRowOrCol(dir) {
            if (dir === 'row') {
                for (let r = ROWS - 1; r > activeCell.row; r--) for (let c = 0; c < COLS; c++) {
                    const o = `${String.fromCharCode(65 + c)}${r}`, n = `${String.fromCharCode(65 + c)}${r + 1}`;
                    if (sheetData[o]) sheetData[n] = sheetData[o];
                }
                for (let c = 0; c < COLS; c++) delete sheetData[`${String.fromCharCode(65 + c)}${activeCell.row + 1}`];
            } else {
                for (let c = COLS - 1; c > activeCell.col; c--) for (let r = 0; r < ROWS; r++) {
                    const o = `${String.fromCharCode(64 + c)}${r + 1}`, n = `${String.fromCharCode(65 + c)}${r + 1}`;
                    if (sheetData[o]) sheetData[n] = sheetData[o];
                }
                for (let r = 0; r < ROWS; r++) delete sheetData[`${String.fromCharCode(65 + activeCell.col)}${r + 1}`];
            }
            saveLocally(); createGrid();
        }

        function startColResize(e) {
            e.stopPropagation(); e.preventDefault();
            const handle = e.target; handle.classList.add('active');
            const colIdx = parseInt(handle.dataset.col);
            const th = document.querySelector(`.gh-col[data-col="${colIdx}"]`);
            const startWidth = th.offsetWidth;
            function move(ev) { const w = Math.max(40, startWidth + (ev.clientX - e.clientX)); th.style.width = `${w}px`; th.style.minWidth = `${w}px`; }
            function up() { handle.classList.remove('active'); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); if (!sheetData._colWidths) sheetData._colWidths = {}; sheetData._colWidths[colIdx] = th.offsetWidth; saveLocally(); }
            document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
        }

        // --- File System API ---
        async function saveDirect() {
            if (!window.showSaveFilePicker) { alert("Direct saving requires Chrome/Edge."); return; }
            try {
                if (!fileHandle) fileHandle = await window.showSaveFilePicker({ suggestedName: 'PosterC3ll.pcl', types: [{ description: 'PosterC3ll File', accept: { 'application/json': ['.pcl'] } }] });
                const w = await fileHandle.createWritable(); await w.write(JSON.stringify(sheetData)); await w.close();
            } catch (err) {}
        }
        async function openDirect() {
            if (!window.showOpenFilePicker) { document.getElementById('fileInput').click(); return; }
            try {
                const [h] = await window.showOpenFilePicker({ types: [{ description: 'PosterC3ll File', accept: { 'application/json': ['.pcl', '.json'] } }] });
                fileHandle = h; const file = await h.getFile(); sheetData = JSON.parse(await file.text()); saveLocally(); createGrid();
            } catch (err) {}
        }
        document.getElementById('btnSaveDirect').onclick = saveDirect;
        document.getElementById('btnOpen').onclick = openDirect;

        // --- P2P ---
        function startP2PSharing() {
            if (typeof Peer === 'undefined') return;
            peer = new Peer(); const statusEl = document.getElementById('p2pStatus');
            peer.on('open', (id) => {
                const url = `${window.location.origin}${window.location.pathname}?peer=${id}`;
                navigator.clipboard.writeText(url); statusEl.textContent = "Live: Link Copied!"; statusEl.classList.add('live');
                alert("Share link copied!\nKeep this tab open.");
            });
            peer.on('connection', (c) => {
                conn = c; conn.on('open', () => { statusEl.textContent = "Live: Connected"; conn.send({ type: 'full_sync', data: sheetData }); });
                conn.on('data', handleRemoteData); conn.on('close', () => statusEl.textContent = "Live: Disconnected");
            });
        }
        document.getElementById('btnShareLive').onclick = startP2PSharing;

        function joinP2PSession(hostId) {
            peer = new Peer(); const statusEl = document.getElementById('p2pStatus');
            peer.on('open', () => { statusEl.textContent = "Live: Connecting..."; statusEl.classList.add('live'); conn = peer.connect(hostId);
                conn.on('open', () => statusEl.textContent = "Live: Connected"); conn.on('data', handleRemoteData); conn.on('close', () => statusEl.textContent = "Live: Disconnected");
            });
        }
        function handleRemoteData(p) {
            if (p.type === 'full_sync' || p.type === 'partial_update') {
                isApplyingRemoteData = true;
                if (p.type === 'full_sync') sheetData = p.data; else Object.assign(sheetData, p.data);
                recalculateAndRender(); isApplyingRemoteData = false;
            }
        }

        // --- Formula Bar Crosshair ---
        formulaBar.addEventListener('focus', () => isFormulaBarFocused = true);
        formulaBar.addEventListener('blur', () => setTimeout(() => isFormulaBarFocused = false, 200));

        // --- Global Keys ---
        document.addEventListener('keydown', (e) => {
            if (paletteOverlay.style.display === 'flex') return;
            if (cellEditor.style.display === 'block' || document.activeElement === formulaBar) return;
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openPalette(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveDirect(); return; }
            if (e.key === 'ArrowRight') moveActiveCell(0, 1);
            else if (e.key === 'ArrowLeft') moveActiveCell(0, -1);
            else if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); moveActiveCell(1, 0); }
            else if (e.key === 'ArrowUp') moveActiveCell(-1, 0);
            else if (e.key === 'Delete' || e.key === 'Backspace') clearContents();
            else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                const td = document.querySelector(`.cell[data-row="${activeCell.row}"][data-col="${activeCell.col}"]`);
                if (td) { startEditing(td); cellEditor.value = e.key; }
            }
        });

        formulaBar.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const id = `${String.fromCharCode(65 + activeCell.col)}${activeCell.row + 1}`;
                if (!sheetData[id]) sheetData[id] = { s: {} };
                sheetData[id].v = formulaBar.value; saveLocally(); recalculateAndRender(); moveActiveCell(1, 0);
            }
        });

        let saveTimeout;
        function saveLocally() {
            if (isApplyingRemoteData) return;
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('posterC3llData', JSON.stringify(sheetData));
                if (conn && conn.open) conn.send({ type: 'partial_update', data: sheetData });
            }, 300);
        }

        // --- Init ---
        createGrid();
        gridWrapper.addEventListener('scroll', updateSelectionUI);
        window.addEventListener('resize', updateSelectionUI);
        
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('peer')) joinP2PSession(urlParams.get('peer'));
    </script>
