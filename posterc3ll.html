<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="version" content="1.5"> <!-- Hardcoded Meta Version -->
    <title>PosterC3ll - Spreadsheet</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #ffffff; color: #333333; overflow: hidden; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: #ffffff; border-bottom: 1px solid #e5e7eb; }
        .nav-left { display: flex; align-items: center; gap: 10px; }
        .logo { width: 28px; height: 28px; }
        .brand-name { font-size: 18px; font-weight: 700; color: #047857; }
        .nav-badge { font-size: 12px; color: #6b7280; background: #ecfdf5; padding: 4px 8px; border-radius: 4px; border: 1px solid #a7f3d0; }

        /* Ribbon */
        .ribbon { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
        .btn-ribbon { padding: 6px 10px; border: 1px solid transparent; background: transparent; border-radius: 4px; cursor: pointer; font-size: 14px; color: #333; }
        .btn-ribbon:hover { background: #f3f4f6; border-color: #e5e7eb; }
        
        /* Toolbar */
        .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ffffff; border-bottom: 1px solid #e5e7eb; }
        #cellName { border: 1px solid #d1d5db; padding: 6px; border-radius: 4px; width: 60px; text-align: center; font-weight: bold; font-size: 14px; color: #047857; background: #ecfdf5; }
        .fx-label { font-style: italic; font-weight: bold; color: #6b7280; margin-left: 10px; }
        #formulaBar { flex: 1; border: 1px solid #d1d5db; padding: 6px; border-radius: 4px; font-family: monospace; font-size: 14px; outline: none; }
        #formulaBar:focus { border-color: #10b981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }

        /* Grid */
        #gridContainer { flex: 1; overflow: auto; position: relative; background: #ffffff; }
        table { border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid #e5e7eb; padding: 0; margin: 0; }
        th { background: #f9fafb; color: #6b7280; font-weight: 500; font-size: 12px; padding: 4px; min-width: 40px; text-align: center; cursor: pointer; }
        td { min-width: 100px; width: 100px; height: 24px; overflow: hidden; font-size: 13px; position: relative; vertical-align: middle; }
        .cell-content { padding: 0 4px; height: 24px; line-height: 24px; white-space: nowrap; overflow: hidden; width: 100%; text-overflow: clip; }
        td.active-cell { outline: 2px solid #10b981; outline-offset: -2px; z-index: 2; position: relative; background: #ffffff !important; }
        
        #cellEditor { position: absolute; border: none; outline: 2px solid #10b981; padding: 0 4px; font-size: 13px; display: none; z-index: 10; background: #ffffff; box-sizing: border-box; line-height: 24px; font-family: 'Segoe UI', Arial, sans-serif; color: #333; }
        input[type="color"] { width: 30px; height: 30px; border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; padding: 2px; background: #fff; }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <linearGradient id="cbgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#F0FDF4"/><stop offset="1" stop-color="#DCFCE7"/></linearGradient>
            <radialGradient id="cpinGrad" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#6EE7B7"/><stop offset="1" stop-color="#10B981"/></radialGradient>
            <filter id="cshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1A1D21" flood-opacity="0.2"/></filter>
        </defs>
    </svg>

    <nav class="navbar">
        <div class="nav-left">
            <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="28" fill="url(#cbgGrad)"/><rect x="1.5" y="1.5" width="117" height="117" rx="26.5" fill="none" stroke="#1A1D21" stroke-opacity="0.05"/><path d="M38 42 L60 24" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/><path d="M82 42 L60 24" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/><circle cx="38" cy="42" r="2.5" fill="#10B981"/><circle cx="82" cy="42" r="2.5" fill="#10B981"/><rect x="32" y="38" width="56" height="64" rx="10" fill="#FFFFFF" filter="url(#cshadow)"/><circle cx="60" cy="62" r="16" fill="#ECFDF5"/><g fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="51" y="53" width="18" height="18" rx="2"/><line x1="51" y1="59" x2="69" y2="59"/><line x1="51" y1="65" x2="69" y2="65"/><line x1="57" y1="53" x2="57" y2="71"/><line x1="63" y1="53" x2="63" y2="71"/></g><rect x="57" y="59" width="6" height="6" fill="#047857" stroke="none"/><rect x="42" y="86" width="36" height="5" rx="2.5" fill="#1A1D21"/><rect x="48" y="94" width="24" height="5" rx="2.5" fill="#10B981"/><circle cx="60" cy="20" r="7" fill="url(#cpinGrad)" filter="url(#cshadow)"/><circle cx="57.5" cy="17.5" r="1.8" fill="#FFFFFF" opacity="0.7"/></svg>
            <span class="brand-name">PosterC3ll</span>
        </div>
        <div class="nav-badge">Version 1.5 | Account-Free & Local</div>
    </nav>

    <div class="ribbon">
        <button class="btn-ribbon" style="font-weight:bold;" onclick="applyFormat('fontWeight', 'bold')">B</button>
        <button class="btn-ribbon" style="font-style:italic;" onclick="applyFormat('fontStyle', 'italic')">I</button>
        <button class="btn-ribbon" style="text-decoration:underline;" onclick="applyFormat('textDecoration', 'underline')">U</button>
        <div style="width: 1px; height: 20px; background: #e5e7eb; margin: 0 5px;"></div>
        <input type="color" id="bgColorPicker" onchange="applyFormat('backgroundColor', this.value)" title="Fill Color">
        <input type="color" id="txtColorPicker" onchange="applyFormat('color', this.value)" title="Font Color" value="#333333">
        <div style="width: 1px; height: 20px; background: #e5e7eb; margin: 0 5px;"></div>
        <button class="btn-ribbon" onclick="applyFormat('textAlign', 'left')">Left</button>
        <button class="btn-ribbon" onclick="applyFormat('textAlign', 'center')">Center</button>
        <button class="btn-ribbon" onclick="applyFormat('textAlign', 'right')">Right</button>
    </div>

    <div class="toolbar">
        <input type="text" id="cellName" readonly>
        <span class="fx-label">fx</span>
        <input type="text" id="formulaBar" onkeydown="if(event.key==='Enter'){applyFormulaBar();}">
    </div>

    <div id="gridContainer">
        <table id="sheet">
            <thead id="sheetHead"></thead>
            <tbody id="sheetBody"></tbody>
        </table>
        <input type="text" id="cellEditor">
    </div>

    <script>
        const APP_VERSION = "1.5"; // Hardcoded JS version variable
        var ROWS = 50, COLS = 26;
        var sheetData = {};
        var activeRow = 0, activeCol = 0;
        var activeEl = null;
        var isEditing = false;

        var sheetHead = document.getElementById('sheetHead');
        var sheetBody = document.getElementById('sheetBody');
        var gridContainer = document.getElementById('gridContainer');
        var cellEditor = document.getElementById('cellEditor');
        var cellNameInput = document.getElementById('cellName');
        var formulaBar = document.getElementById('formulaBar');

        function getCellId(r, c) { return String.fromCharCode(65 + c) + (r + 1); }

        function initGrid() {
            var headHtml = '<tr><th></th>';
            for (var c = 0; c < COLS; c++) {
                headHtml += '<th>' + String.fromCharCode(65 + c) + '</th>';
            }
            headHtml += '</tr>';
            sheetHead.innerHTML = headHtml;

            var bodyHtml = '';
            for (var r = 0; r < ROWS; r++) {
                bodyHtml += '<tr><th>' + (r + 1) + '</th>';
                for (var c = 0; c < COLS; c++) {
                    var id = getCellId(r, c);
                    // Using inline onclick is the most bulletproof way to handle grid clicks in JS
                    bodyHtml += '<td id="cell_' + id + '" onclick="selectCell(' + r + ', ' + c + ')" ondblclick="editCell(' + r + ', ' + c + ')"><div class="cell-content"></div></td>';
                }
                bodyHtml += '</tr>';
            }
            sheetBody.innerHTML = bodyHtml;
            
            selectCell(0, 0);
        }

        function selectCell(r, c) {
            if (activeEl) activeEl.classList.remove('active-cell');
            activeRow = r;
            activeCol = c;
            var id = getCellId(r, c);
            activeEl = document.getElementById('cell_' + id);
            if (activeEl) activeEl.classList.add('active-cell');
            
            cellNameInput.value = id;
            var data = sheetData[id] || { v: '', s: {} };
            formulaBar.value = data.v || '';
        }

        function editCell(r, c) {
            var id = getCellId(r, c);
            var td = document.getElementById('cell_' + id);
            var rect = td.getBoundingClientRect();
            var containerRect = gridContainer.getBoundingClientRect();
            
            cellEditor.style.display = 'block';
            cellEditor.style.left = (rect.left - containerRect.left + gridContainer.scrollLeft) + 'px';
            cellEditor.style.top = (rect.top - containerRect.top + gridContainer.scrollTop) + 'px';
            cellEditor.style.width = rect.width + 'px';
            cellEditor.style.height = rect.height + 'px';
            
            var data = sheetData[id] || { v: '', s: {} };
            cellEditor.value = data.v || '';
            cellEditor.focus();
            cellEditor.select();
            isEditing = true;
            
            cellEditor.onblur = function() { saveEdit(r, c); isEditing = false; };
            cellEditor.onkeydown = function(e) {
                if (e.key === 'Enter') { e.preventDefault(); saveEdit(r, c); selectCell(Math.min(ROWS-1, r+1), c); }
                else if (e.key === 'Tab') { e.preventDefault(); saveEdit(r, c); selectCell(r, Math.min(COLS-1, c+1)); }
                else if (e.key === 'Escape') { cellEditor.style.display = 'none'; isEditing = false; }
            };
        }

        function saveEdit(r, c) {
            if (cellEditor.style.display === 'none') return;
            var id = getCellId(r, c);
            if (!sheetData[id]) sheetData[id] = { v: '', s: {} };
            sheetData[id].v = cellEditor.value;
            cellEditor.style.display = 'none';
            renderCell(r, c);
            saveData();
            recalculateAll();
        }

        function applyFormulaBar() {
            var id = getCellId(activeRow, activeCol);
            if (!sheetData[id]) sheetData[id] = { v: '', s: {} };
            sheetData[id].v = formulaBar.value;
            renderCell(activeRow, activeCol);
            saveData();
            recalculateAll();
            selectCell(Math.min(ROWS-1, activeRow+1), activeCol);
        }

        function renderCell(r, c) {
            var id = getCellId(r, c);
            var el = document.getElementById('cell_' + id);
            if (!el) return;
            
            var contentDiv = el.querySelector('.cell-content');
            if (!contentDiv) return;
            
            var data = sheetData[id] || { v: '', s: {} };
            var style = data.s || {};
            
            el.style.fontWeight = style.fontWeight || 'normal';
            el.style.fontStyle = style.fontStyle || 'normal';
            el.style.textDecoration = style.textDecoration || 'none';
            el.style.backgroundColor = style.backgroundColor || 'transparent';
            el.style.color = style.color || '#333333';
            el.style.textAlign = style.textAlign || 'left';
            
            var val = data.v;
            if (val !== undefined && val !== '' && typeof val === 'string' && val.startsWith('=')) {
                try {
                    val = evalFormula(val.substring(1));
                    if (typeof val === 'number' && isNaN(val)) val = '';
                } catch (e) {
                    val = '#ERROR!';
                }
            }
            contentDiv.textContent = val;
        }

        function evalFormula(formula) {
            formula = formula.replace(/SUM\(([^)]+)\)/gi, function(match, range) {
                var parts = range.split(':');
                return sumRange(parts[0], parts[1]);
            });
            formula = formula.replace(/([A-Z]+)([0-9]+)/g, function(match, col, row) {
                var id = col + row;
                if (sheetData[id] && sheetData[id].v !== undefined) {
                    var val = sheetData[id].v;
                    if (typeof val === 'string' && val.startsWith('=')) val = evalFormula(val.substring(1));
                    return parseFloat(val) || 0;
                }
                return 0;
            });
            if (!/^[0-9+\-*/().\s]+$/.test(formula)) throw new Error("Invalid");
            return Function('"use strict";return (' + formula + ')')();
        }

        function sumRange(start, end) {
            var sM = start.match(/([A-Z]+)([0-9]+)/);
            var eM = end.match(/([A-Z]+)([0-9]+)/);
            if (!sM || !eM) return 0;
            var sum = 0;
            for (var r = parseInt(sM[2])-1; r < parseInt(eM[2]); r++) {
                for (var c = sM[1].charCodeAt(0)-65; c <= eM[1].charCodeAt(0)-65; c++) {
                    var id = String.fromCharCode(65+c) + (r+1);
                    if (sheetData[id] && sheetData[id].v !== undefined) {
                        var val = parseFloat(sheetData[id].v);
                        if (!isNaN(val)) sum += val;
                    }
                }
            }
            return sum;
        }

        function recalculateAll() {
            for (var r = 0; r < ROWS; r++) {
                for (var c = 0; c < COLS; c++) {
                    renderCell(r, c);
                }
            }
        }

        function applyFormat(prop, val) {
            var id = getCellId(activeRow, activeCol);
            if (!sheetData[id]) sheetData[id] = { v: '', s: {} };
            if (!sheetData[id].s) sheetData[id].s = {};
            
            // Toggle for bold/italic/underline
            if (prop === 'fontWeight' || prop === 'fontStyle' || prop === 'textDecoration') {
                sheetData[id].s[prop] = (sheetData[id].s[prop] === val) ? '' : val;
            } else {
                sheetData[id].s[prop] = val;
            }
            
            renderCell(activeRow, activeCol);
            saveData();
        }

        function saveData() {
            localStorage.setItem('posterC3llData', JSON.stringify(sheetData));
        }

        function loadData() {
            var data = localStorage.getItem('posterC3llData');
            if (data) {
                try {
                    sheetData = JSON.parse(data);
                    recalculateAll();
                } catch(e) {
                    console.error("Data corrupted. Resetting.");
                    localStorage.removeItem('posterC3llData');
                    sheetData = {};
                }
            }
        }

        // Global Keyboard Navigation
        document.addEventListener('keydown', function(e) {
            if (isEditing || document.activeElement === formulaBar) return;
            
            var r = activeRow, c = activeCol;
            var moved = false;
            
            if (e.key === 'ArrowRight') { c = Math.min(COLS-1, c+1); moved = true; }
            else if (e.key === 'ArrowLeft') { c = Math.max(0, c-1); moved = true; }
            else if (e.key === 'ArrowDown' || e.key === 'Enter') { r = Math.min(ROWS-1, r+1); moved = true; e.preventDefault(); }
            else if (e.key === 'ArrowUp') { r = Math.max(0, r-1); moved = true; }
            else if (e.key === 'Delete' || e.key === 'Backspace') {
                var id = getCellId(r, c);
                if (sheetData[id]) {
                    sheetData[id].v = '';
                    renderCell(r, c);
                    saveData();
                }
                e.preventDefault();
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                editCell(r, c);
                cellEditor.value = e.key;
                e.preventDefault();
            }
            
            if (moved) {
                selectCell(r, c);
                e.preventDefault();
            }
        });

        // Initialize immediately
        initGrid();
        loadData();
    </script>
</body>
</html>
